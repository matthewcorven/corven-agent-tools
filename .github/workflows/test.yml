name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run issue-work-queue unit tests
        run: python3 -m unittest discover -s plugins/corven-dev/skills/issue-work-queue/tests -v
