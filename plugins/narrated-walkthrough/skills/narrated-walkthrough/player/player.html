<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>__TITLE__</title>
__MERMAID__
<style>
  :root {
    color-scheme: light dark;
    --surface: var(--background-color-default, #ffffff);
    --ink: var(--text-color-default, #1b1b1f);
    --dim: var(--text-color-muted, #6b6b76);
    --line: var(--border-color-default, #e3e3ea);
    --bg: color-mix(in srgb, var(--surface) 97%, var(--ink));
    --surface-sub: color-mix(in srgb, var(--surface) 94%, var(--ink));
    --surface-hover: color-mix(in srgb, var(--surface) 88%, var(--ink));
    --chrome-bg: color-mix(in srgb, var(--surface) 93%, transparent);
    --control-bg: color-mix(in srgb, var(--surface) 96%, var(--ink));
    --track-bg: color-mix(in srgb, var(--ink) 12%, var(--surface));
    --pill-bg: color-mix(in srgb, var(--ink) 7%, var(--surface));
    --shadow-sm: 0 1px 3px rgba(0,0,0,.08);
    --shadow-md: 0 4px 16px rgba(0,0,0,.08);
    --shadow-lg: 0 10px 28px rgba(0,0,0,.09);

    --accent: #3d6fd0;
    --accent-ink: #ffffff;
    --accent-soft-bg: #eef4ff;
    --accent-soft-ink: #2a56b3;
    --accent-soft-border: #c9dafc;

    --ok-bg: #e8f6ec;
    --ok-ink: #1f6b38;
    --ok-border: #bfe3c9;

    --warn-bg: #fff4e5;
    --warn-ink: #9a5b08;
    --warn-border: #f0d3a5;

    --err-bg: #fdecec;
    --err-ink: #b42318;
    --err-border: #f5c2c0;

    --lead-bg: #f5f8ff;
    --lead-border: #b8cdf5;
    --video-bg: #f3fbf5;
    --video-border: #bfe3c9;

    --ask-bg: #fffdf6;
    --ask-border: #e8d9a8;
    --ask-divider: #efe4be;

    --code-bg: #161b22;
    --code-ink: #e6edf3;
    --status-bar-color: var(--background-color-default, #ffffff);
  }

  :root[data-color-mode="dark"],
  body[data-color-mode="dark"],
  :root.is-dark {
    color-scheme: dark;
    --surface: var(--background-color-default, #0d1117);
    --ink: var(--text-color-default, #e6edf3);
    --dim: var(--text-color-muted, #8b949e);
    --line: var(--border-color-default, #30363d);
    --bg: color-mix(in srgb, var(--surface) 94%, #000000);
    --surface-sub: color-mix(in srgb, var(--surface) 93%, #ffffff);
    --surface-hover: color-mix(in srgb, var(--surface) 88%, #ffffff);
    --chrome-bg: color-mix(in srgb, var(--surface) 92%, transparent);
    --control-bg: color-mix(in srgb, var(--surface) 91%, #ffffff);
    --track-bg: color-mix(in srgb, #ffffff 14%, var(--surface));
    --pill-bg: color-mix(in srgb, #ffffff 8%, var(--surface));
    --shadow-sm: 0 1px 4px rgba(0,0,0,.35);
    --shadow-md: 0 4px 18px rgba(0,0,0,.45);
    --shadow-lg: 0 10px 30px rgba(0,0,0,.5);

    --accent: #58a6ff;
    --accent-ink: #0d1117;
    --accent-soft-bg: rgba(88,166,255,.14);
    --accent-soft-ink: #79c0ff;
    --accent-soft-border: rgba(88,166,255,.35);

    --ok-bg: rgba(63,185,80,.15);
    --ok-ink: #7ee787;
    --ok-border: rgba(63,185,80,.38);

    --warn-bg: rgba(210,153,34,.16);
    --warn-ink: #f0b72f;
    --warn-border: rgba(210,153,34,.4);

    --err-bg: rgba(248,81,73,.15);
    --err-ink: #ff7b72;
    --err-border: rgba(248,81,73,.4);

    --lead-bg: rgba(88,166,255,.09);
    --lead-border: rgba(88,166,255,.35);
    --video-bg: rgba(63,185,80,.09);
    --video-border: rgba(63,185,80,.35);

    --ask-bg: color-mix(in srgb, var(--surface) 92%, #d29922);
    --ask-border: rgba(210,153,34,.42);
    --ask-divider: rgba(210,153,34,.24);

    --code-bg: #090d13;
    --code-ink: #e6edf3;
    --status-bar-color: var(--background-color-default, #0d1117);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-color-mode="light"]) {
      color-scheme: dark;
      --surface: var(--background-color-default, #0d1117);
      --ink: var(--text-color-default, #e6edf3);
      --dim: var(--text-color-muted, #8b949e);
      --line: var(--border-color-default, #30363d);
      --bg: color-mix(in srgb, var(--surface) 94%, #000000);
      --surface-sub: color-mix(in srgb, var(--surface) 93%, #ffffff);
      --surface-hover: color-mix(in srgb, var(--surface) 88%, #ffffff);
      --chrome-bg: color-mix(in srgb, var(--surface) 92%, transparent);
      --control-bg: color-mix(in srgb, var(--surface) 91%, #ffffff);
      --track-bg: color-mix(in srgb, #ffffff 14%, var(--surface));
      --pill-bg: color-mix(in srgb, #ffffff 8%, var(--surface));
      --shadow-sm: 0 1px 4px rgba(0,0,0,.35);
      --shadow-md: 0 4px 18px rgba(0,0,0,.45);
      --shadow-lg: 0 10px 30px rgba(0,0,0,.5);

      --accent: #58a6ff;
      --accent-ink: #0d1117;
      --accent-soft-bg: rgba(88,166,255,.14);
      --accent-soft-ink: #79c0ff;
      --accent-soft-border: rgba(88,166,255,.35);

      --ok-bg: rgba(63,185,80,.15);
      --ok-ink: #7ee787;
      --ok-border: rgba(63,185,80,.38);

      --warn-bg: rgba(210,153,34,.16);
      --warn-ink: #f0b72f;
      --warn-border: rgba(210,153,34,.4);

      --err-bg: rgba(248,81,73,.15);
      --err-ink: #ff7b72;
      --err-border: rgba(248,81,73,.4);

      --lead-bg: rgba(88,166,255,.09);
      --lead-border: rgba(88,166,255,.35);
      --video-bg: rgba(63,185,80,.09);
      --video-border: rgba(63,185,80,.35);

      --ask-bg: color-mix(in srgb, var(--surface) 92%, #d29922);
      --ask-border: rgba(210,153,34,.42);
      --ask-divider: rgba(210,153,34,.24);

      --code-bg: #090d13;
      --code-ink: #e6edf3;
      --status-bar-color: var(--background-color-default, #0d1117);
    }
  }

  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.55 var(--font-sans, -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif);
         color:var(--ink); background:var(--bg); }
  header { display:flex; align-items:center; gap:14px; padding:12px 22px;
           border-bottom:1px solid var(--line); background:var(--chrome-bg);
           backdrop-filter:blur(8px); position:sticky; top:0; z-index:10;
           transition:box-shadow .2s ease; }
  header.is-compact { box-shadow:var(--shadow-md); }
  header h1 { font-size:15px; margin:0; font-weight:650; letter-spacing:.01em; white-space:nowrap;
              overflow:hidden; text-overflow:ellipsis; color:var(--ink); }
  .mini-media { display:flex; align-items:center; gap:10px; flex:1 1 260px; max-width:440px;
                margin-left:8px; opacity:0; transform:translateY(-3px);
                transition:opacity .18s ease, transform .18s ease; }
  header.is-compact .mini-media { opacity:1; transform:none; }
  .mini-media[hidden] { display:none; }
  .mini-btn { font:inherit; font-size:12px; padding:5px 12px; border-radius:999px;
              background:var(--accent); border:1px solid var(--accent); color:var(--accent-ink);
              font-weight:600; cursor:pointer; white-space:nowrap; }
  .mini-track { flex:1 1 120px; height:6px; background:var(--track-bg); border-radius:999px;
                overflow:hidden; cursor:pointer; min-width:90px; }
  .mini-track > i { display:block; height:100%; width:100%; background:var(--accent);
                    transform-origin:left center; transform:scaleX(0); transition:transform .18s linear; }
  .mini-clock { font-variant-numeric:tabular-nums; font-size:12px; color:var(--dim);
                white-space:nowrap; min-width:74px; text-align:right; }
  header .meta { font-size:12px; color:var(--dim); margin-left:auto; white-space:nowrap; }
  header .meta.is-fallback { color:var(--warn-ink); font-weight:600; }
  main { max-width:1080px; margin:0 auto; padding:24px 22px 148px; }
  .bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:20px;
         padding:12px 16px; background:var(--surface); border:1px solid var(--line);
         border-radius:12px; }
  button { font:inherit; font-size:14px; padding:8px 15px; border-radius:9px; cursor:pointer;
           border:1px solid var(--line); background:var(--control-bg); color:var(--ink);
           transition:border-color .15s ease, background-color .15s ease; }
  button:hover:not(:disabled) { border-color:var(--accent); background:var(--surface-hover); }
  button.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600; }
  button.primary:hover:not(:disabled) { filter:brightness(1.06); background:var(--accent); }
  button:disabled { opacity:.45; cursor:default; }
  .track { flex:1 1 300px; height:7px; background:var(--track-bg); border-radius:4px; overflow:hidden;
           min-width:180px; cursor:pointer; }
  .track > i { display:block; height:100%; width:100%; background:var(--accent);
               transform-origin:left center; transform:scaleX(0); transition:transform .2s linear; }
  .clock { font-variant-numeric:tabular-nums; font-size:12px; color:var(--dim); min-width:96px; text-align:right; }

  /* Unified A-HUD container: integrated single-row pack tab-header + connected tab-body */
  .hud { background:var(--surface); border:1px solid var(--line); border-radius:14px;
         padding:0; margin-bottom:20px; overflow:hidden; }
  .hud[hidden] { display:none; }
  .hud-tabbar { display:flex; align-items:flex-end; justify-content:space-between; gap:10px;
                background:var(--surface-sub); border-bottom:1px solid var(--line);
                padding:10px 14px 0; }
  .hud-tabstrip { display:flex; align-items:flex-end; gap:6px; flex-wrap:nowrap;
                  overflow-x:auto; scrollbar-width:thin; flex:1 1 auto; min-width:0; }
  .hud-tab { flex:0 0 auto; text-align:left; border:1px solid transparent; border-bottom:1px solid transparent;
             border-radius:10px 10px 0 0; padding:8px 13px 10px; background:transparent;
             color:var(--dim); display:flex; flex-direction:column; gap:3px; max-width:260px;
             transition:background-color .15s ease, color .15s ease, border-color .15s ease; }
  .hud-tab:hover:not(.active):not(:disabled) { background:var(--surface-hover); color:var(--ink);
                                               border-color:var(--line); border-bottom-color:transparent; }
  .hud-tab.active { background:var(--surface); color:var(--ink); border-color:var(--line);
                    border-top:2px solid var(--accent); border-bottom-color:var(--surface);
                    margin-bottom:-1px; }
  .hud-tab-top { display:flex; align-items:center; gap:7px; font-size:10px; }
  .hud-tab-kind { font-weight:700; text-transform:uppercase; letter-spacing:.06em; padding:2px 6px;
                  border-radius:999px; background:var(--pill-bg); color:var(--dim); }
  .hud-tab.active .hud-tab-kind { background:var(--accent); color:var(--accent-ink); }
  .hud-tab-meta { color:var(--dim); white-space:nowrap; }
  .hud-tab-name { font-size:12.5px; font-weight:650; line-height:1.25; white-space:nowrap;
                  overflow:hidden; text-overflow:ellipsis; }
  .hud-tabtools { flex:0 0 auto; display:flex; align-items:center; gap:8px; padding-bottom:9px;
                  white-space:nowrap; }
  .hud-refresh { font-size:11px; padding:4px 10px; border-radius:7px; }
  .hud-body { padding:18px 22px 20px; }
  .hud-top { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
             margin-bottom:10px; }
  .hud-title { font-size:12px; text-transform:uppercase; letter-spacing:.09em; color:var(--dim);
               font-weight:700; }
  .hud-prov { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:11px; color:var(--dim);
              margin:0 0 12px; }
  .prov-chip { padding:2px 8px; border-radius:999px; background:var(--pill-bg); border:1px solid var(--line);
               color:var(--dim); font-weight:600; }
  .prov-chip.live { background:var(--ok-bg); color:var(--ok-ink); border-color:var(--ok-border); }
  .prov-chip.stale { background:var(--warn-bg); color:var(--warn-ink); border-color:var(--warn-border); }
  .hud-summary { font-size:14px; color:var(--ink); margin:0 0 14px; }
  .oversight { display:inline-flex; gap:4px; background:var(--pill-bg); padding:3px; border-radius:9px;
               border:1px solid var(--line); }
  .oversight button { border:none; background:transparent; font-size:12px; padding:5px 10px;
                      border-radius:7px; color:var(--dim); font-weight:600; }
  .oversight button:hover:not(:disabled) { background:var(--surface-hover); color:var(--ink); }
  .oversight button.on { background:var(--surface); color:var(--ink); box-shadow:var(--shadow-sm); }
  .hud-stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px;
               margin-bottom:14px; }
  .stat-card { border:1px solid var(--line); border-radius:10px; padding:10px 12px; background:var(--surface-sub); }
  .stat-label { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); }
  .stat-val { font-size:22px; font-weight:700; margin:2px 0; color:var(--ink); }
  .stat-trend { display:inline-block; font-size:11px; padding:2px 7px; border-radius:999px; font-weight:600;
                background:var(--pill-bg); color:var(--dim); }
  .stat-trend.ok { background:var(--ok-bg); color:var(--ok-ink); }
  .stat-trend.warn { background:var(--warn-bg); color:var(--warn-ink); }
  .hud-nodes { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px;
               margin-top:10px; }
  .node-card { border:1px solid var(--line); border-radius:10px; padding:11px 13px; background:var(--surface-sub);
               display:flex; flex-direction:column; gap:6px; }
  .node-card.lead { border-color:var(--lead-border); background:var(--lead-bg); }
  .node-card.video { border-color:var(--video-border); background:var(--video-bg); }
  .node-card.state-bottleneck { border-color:var(--err-border); }
  .node-card.state-waiting_merge { border-color:var(--warn-border); }
  .node-head { display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .node-name { font-weight:650; font-size:14px; color:var(--ink); }
  .node-role { font-size:11px; padding:2px 7px; border-radius:999px; background:var(--pill-bg); color:var(--dim);
               font-weight:600; }
  .node-state { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:650;
                padding:2px 8px; border-radius:999px; align-self:flex-start;
                background:var(--pill-bg); color:var(--dim); border:1px solid var(--line); }
  .node-state.active, .node-state.ready { background:var(--ok-bg); color:var(--ok-ink); border-color:var(--ok-border); }
  .node-state.waiting_merge, .node-state.idle { background:var(--warn-bg); color:var(--warn-ink); border-color:var(--warn-border); }
  .node-state.bottleneck { background:var(--err-bg); color:var(--err-ink); border-color:var(--err-border); }
  .node-desc { font-size:13px; color:var(--dim); margin:0; }
  .node-actions { display:flex; gap:6px; flex-wrap:wrap; margin-top:auto; padding-top:2px; }
  .node-btn { font-size:12px; padding:5px 10px; border-radius:7px; }
  .node-btn.copied { border-color:var(--ok-border); color:var(--ok-ink); background:var(--ok-bg); }
  .node-rules-btn { font-size:11px; padding:3px 7px; border-radius:6px; color:var(--dim); }
  .node-rules-box { margin-top:6px; padding:8px 10px; border-radius:8px; background:var(--code-bg);
                    color:var(--code-ink); border:1px solid var(--line); font-size:11px; line-height:1.45;
                    font-family:var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace); }
  .det-result { margin-top:14px; padding:14px 16px; border-radius:12px; background:var(--surface-sub);
                border:1px solid var(--accent-soft-border); }
  .det-head { display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;
              margin-bottom:8px; }
  .det-title { font-size:14px; font-weight:700; color:var(--ink); }
  .det-badges { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .det-summary { font-size:13px; color:var(--ink); margin:0 0 8px; }
  .det-formula { font-size:11px; padding:6px 10px; border-radius:8px; background:var(--code-bg);
                 color:var(--code-ink); border:1px solid var(--line); margin-bottom:10px;
                 font-family:var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace); }
  .det-list { margin:0 0 10px; padding-left:18px; font-size:12px; color:var(--dim); }
  .det-list li { margin:2px 0; }
  .det-list b { color:var(--ink); }
  .det-actions { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .det-raw { margin-top:10px; }
  .det-raw summary { font-size:11px; color:var(--dim); cursor:pointer; font-weight:600; }
  .det-raw pre { margin:6px 0 0; padding:10px; border-radius:8px; background:var(--code-bg);
                 color:var(--code-ink); border:1px solid var(--line); font-size:11px; overflow:auto; max-height:220px; }
  .hint.is-live-chat { color:var(--accent-soft-ink); font-weight:600; }
  .hud-artifacts { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; padding-top:10px;
                   border-top:1px solid var(--line); }
  .hud-link { font-size:12px; padding:4px 9px; border-radius:999px; border:1px solid var(--line);
              color:var(--accent); text-decoration:none; background:var(--control-bg); }
  .hud-link:hover { border-color:var(--accent); background:var(--surface-hover); }
  .hud-status { font-size:12px; color:var(--ok-ink); margin-top:8px; min-height:18px; }

  .slide { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:26px 28px;
           margin-bottom:20px; opacity:.42; transition:opacity .35s, box-shadow .35s, transform .35s; }
  .slide.active { opacity:1; box-shadow:var(--shadow-lg); transform:translateY(-1px); }
  .slide h2 { font-size:22px; margin:0 0 4px; font-weight:650; color:var(--ink); }
  .slide .n { font-size:12px; color:var(--dim); text-transform:uppercase; letter-spacing:.09em; }
  .diagram { margin:16px 0 4px; display:flex; justify-content:center; padding:12px;
             border-radius:10px; background:var(--surface-sub); }
  .diagram svg { max-width:100%; height:auto; }
  /* Preserve crisp dark text inside author-authored pastel Mermaid fills in dark mode */
  .is-dark .diagram svg .node[style*="fill:#e"] .nodeLabel,
  .is-dark .diagram svg .node[style*="fill:#f"] .nodeLabel,
  .is-dark .diagram svg .node[style*="fill:#w"] .nodeLabel,
  .is-dark .diagram svg .node[style*="fill: rgb(2"] .nodeLabel,
  .is-dark .diagram svg g.node rect[style*="fill:#e"] ~ g .nodeLabel,
  .is-dark .diagram svg g.node rect[style*="fill:#f"] ~ g .nodeLabel { color:#161922 !important; fill:#161922 !important; }
  .is-dark .diagram svg .cluster rect { fill:rgba(255,255,255,.04) !important; stroke:var(--line) !important; }
  .is-dark .diagram svg .cluster-label .nodeLabel,
  .is-dark .diagram svg .cluster-label span,
  .is-dark .diagram svg .edgeLabel { color:var(--ink) !important; fill:var(--ink) !important; }
  .is-dark .diagram svg .edgeLabel rect,
  .is-dark .diagram svg .labelBkg { fill:var(--surface-sub) !important; background-color:var(--surface-sub) !important; }

  footer { position:fixed; bottom:0; left:0; right:0; background:var(--chrome-bg);
           border-top:1px solid var(--line); padding:14px 22px; backdrop-filter:blur(8px); z-index:9; }
  .cap { max-width:1080px; margin:0 auto; font-size:17px; line-height:1.5; min-height:52px;
         display:flex; align-items:center; color:var(--ink); }
  .cap span { opacity:0; transform:translateY(4px); transition:opacity .22s, transform .22s; }
  .cap span.on { opacity:1; transform:none; }
  .hint { max-width:1080px; margin:6px auto 0; font-size:12px; color:var(--dim); }

  /* A2UI v1.0 / Disposition Choice Surface */
  .ask { background:var(--ask-bg); border:1px solid var(--ask-border); border-radius:14px;
         padding:22px 26px; margin-bottom:20px; }
  .ask-head { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
              margin-bottom:6px; }
  .ask h3 { margin:0; font-size:17px; font-weight:650; color:var(--ink); }
  .a2ui-badge { font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
                padding:3px 8px; border-radius:999px; background:var(--accent-soft-bg);
                color:var(--accent-soft-ink); border:1px solid var(--accent-soft-border); }
  .ask p { margin:0 0 14px; font-size:14px; color:var(--dim); }
  .ask .opts { display:flex; gap:10px; flex-wrap:wrap; }
  .ask .opts button { border:1px solid var(--ask-border); background:var(--control-bg); color:var(--ink); }
  .ask .opts button.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .ask .opts button:hover:not(:disabled) { border-color:var(--accent); }
  .ask .opts button.copied { border-color:var(--ok-border); color:var(--ok-ink); background:var(--ok-bg); }
  .ask .tip { margin:14px 0 0; font-size:13px; color:var(--dim); }
  .ask .tip b { color:var(--ink); }
  .bridge-pill { display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:650;
                 padding:3px 9px; border-radius:999px; background:var(--ok-bg); color:var(--ok-ink);
                 border:1px solid var(--ok-border); }
  .bridge-pill.busy { background:var(--accent-soft-bg); color:var(--accent-soft-ink); border-color:var(--accent-soft-border); }
  .bridge-pill.err { background:var(--err-bg); color:var(--err-ink); border-color:var(--err-border); }
  .steer-row { display:flex; gap:8px; margin-top:12px; }
  .steer-input { flex:1 1 auto; font:inherit; font-size:14px; padding:8px 12px; border-radius:9px;
                 border:1px solid var(--line); background:var(--control-bg); color:var(--ink); }
  .steer-input::placeholder { color:var(--dim); }
  .steer-input:focus { outline:2px solid var(--accent); outline-offset:1px; }
  .a2ui-status { font-size:12px; color:var(--ok-ink); margin-top:8px; min-height:16px; }
  .a2ui-status.err { color:var(--err-ink); }
  .a2ui-raw { margin-top:14px; border-top:1px solid var(--ask-divider); padding-top:10px; }
  .a2ui-raw summary { font-size:12px; color:var(--dim); cursor:pointer; font-weight:600; }
  .a2ui-raw pre { margin:8px 0 0; padding:12px; background:var(--code-bg); color:var(--code-ink);
                  border:1px solid var(--line); border-radius:10px;
                  font-size:12px; line-height:1.45; overflow:auto; max-height:260px; }
</style>
</head>
<body>
<header id="sticky-header">
  <h1>__TITLE__</h1>
  <div class="mini-media" id="mini-media" aria-label="Compact media controls" hidden>
    <button id="mini-play" class="mini-btn" type="button" aria-label="Play or pause">&#9654; Play</button>
    <div class="mini-track" id="mini-track" role="progressbar" aria-label="Playback progress"><i id="mini-fill"></i></div>
    <span class="mini-clock" id="mini-clock">0:00 / 0:00</span>
  </div>
  <div class="meta" id="voice-meta">narration: <b>__MODEL__</b> &middot; voice <b>__VOICE__</b></div>
</header>

<main>
  <div class="bar" id="full-bar">
    <button id="play" class="primary" type="button">&#9654; Play</button>
    <button id="pause" type="button">&#10074;&#10074; Pause</button>
    <button id="restart" type="button">&#8634; Restart</button>
    <button id="voicebtn" type="button" title="Speak with the system voice if the audio cannot play">Use system voice</button>
    <div class="track" id="full-track"><i id="fill"></i></div>
    <div class="clock" id="clock">0:00 / 0:00</div>
  </div>
  <section class="hud" id="hud" aria-label="Architect oversight HUD" hidden></section>
  <div id="slides"></div>
  <section class="ask" id="ask" aria-label="A2UI action surface" hidden></section>
</main>

<footer>
  <div class="cap"><span id="cap"></span></div>
  <div class="hint" id="footer-hint">Space = play/pause &middot; &#8592;/&#8594; = previous/next scene &middot; briefing audio is pre-generated for exact slide sync; pause or click any agent node anytime for live chat</div>
</footer>

<script>
const DATA = __DATA__;

function detectDarkMode() {
  const htmlMode = document.documentElement.getAttribute('data-color-mode');
  const bodyMode = document.body && document.body.getAttribute('data-color-mode');
  const mode = (bodyMode || htmlMode || '').toLowerCase();
  if (mode === 'dark') return true;
  if (mode === 'light') return false;
  if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) return true;
  const bg = getComputedStyle(document.documentElement).getPropertyValue('--background-color-default').trim();
  const hex = bg.match(/^#([0-9a-f]{6})$/i);
  if (hex) {
    const n = parseInt(hex[1], 16);
    const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    return (0.299 * r + 0.587 * g + 0.114 * b) < 128;
  }
  return false;
}

let darkTheme = false;
let mermaidRenderSeq = 0;
function configureMermaid(dark) {
  mermaid.initialize({
    startOnLoad: false,
    theme: 'base',
    securityLevel: 'loose',
    themeVariables: dark
      ? {
          fontFamily: '-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif',
          fontSize: '15px',
          primaryColor: '#1f2633',
          primaryTextColor: '#e6edf3',
          primaryBorderColor: '#484f58',
          lineColor: '#8b949e',
          textColor: '#e6edf3',
          clusterBkg: '#161b22',
          clusterBorder: '#30363d',
          edgeLabelBackground: '#161b22',
        }
      : {
          fontFamily: '-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif',
          fontSize: '15px',
          primaryColor: '#ffffff',
          primaryTextColor: '#1b1b1f',
          primaryBorderColor: '#c9c9d4',
          lineColor: '#8a8a99',
          textColor: '#1b1b1f',
          clusterBkg: '#f8f9fc',
          clusterBorder: '#d8dbe5',
          edgeLabelBackground: '#ffffff',
        },
  });
}

function syncThemeClass() {
  darkTheme = detectDarkMode();
  document.documentElement.classList.toggle('is-dark', darkTheme);
  if (darkTheme && !document.documentElement.getAttribute('data-color-mode')) {
    document.documentElement.setAttribute('data-color-mode', 'dark');
  }
  configureMermaid(darkTheme);
}
syncThemeClass();

const $ = (id) => document.getElementById(id);
const fmt = (s) => Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0');
const esc = (s) => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const safeUrl = (u) => {
  if (typeof u !== 'string' || !u.trim()) return null;
  try {
    const parsed = new URL(u);
    return ['https:', 'http:', 'file:'].includes(parsed.protocol) ? parsed.href : null;
  } catch { return null; }
};

const player = new Audio();
player.preload = 'auto';
let sceneIdx = -1, idx = -1, raf = 0, playing = false;
let useSystem = false, sysStart = 0, sysOffset = 0, sysScene = -1;
let pending = null;
let wallStart = 0, wallBase = 0;
let hudOversight = (DATA.hud && DATA.hud.oversight_default) || 'lead';
let lastA2uiAction = null;
let liveA2uiOverride = null;
let bridgeAgentStatus = 'standalone';
let bridgeSource = null;
let discoveredPacks = [];
let liveTelemetry = null;
let telemetryLoading = false;
let lastDetResult = null;
let expandedRulesNodeId = null;
let liveChatTarget = null;
const DEFAULT_FOOTER_HINT = 'Space = play/pause · ←/→ = previous/next scene · briefing audio is pre-generated for exact slide sync; pause or click any agent node anytime for live chat';
const BRIDGE = (typeof window.__WALKTHROUGH_BRIDGE__ === 'object' && window.__WALKTHROUGH_BRIDGE__) ? window.__WALKTHROUGH_BRIDGE__ : null;
const recordedMetaHtml = $('voice-meta').innerHTML;

function setFooterLiveChat(targetLabel) {
  liveChatTarget = targetLabel || null;
  const el = $('footer-hint');
  if (!el) return;
  if (liveChatTarget) {
    el.classList.add('is-live-chat');
    el.textContent = 'Live chat active (' + liveChatTarget + ') · briefing paused at ' + fmt(now()) + ' — press Space to resume pre-generated playback';
  } else {
    el.classList.remove('is-live-chat');
    el.textContent = DEFAULT_FOOTER_HINT;
  }
}

function pauseForLiveChat(targetLabel) {
  if (playing) pause();
  setFooterLiveChat(targetLabel);
}

function formatPackKind(kind) {
  if (kind === 'pr_review') return 'PR Review';
  if (kind === 'standup') return 'Daily Standup';
  return 'Walkthrough';
}

function formatClockTime(iso) {
  if (!iso) return '';
  try {
    return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  } catch { return iso; }
}

async function loadPacks() {
  if (!BRIDGE || !BRIDGE.packsUrl) return;
  try {
    const resp = await fetch(BRIDGE.packsUrl, { cache: 'no-store' });
    if (!resp.ok) return;
    const data = await resp.json();
    if (Array.isArray(data.packs)) {
      discoveredPacks = data.packs;
      renderHud();
      syncStickyMedia();
    }
  } catch (e) {}
}

async function loadTelemetry(force) {
  if (!BRIDGE || !BRIDGE.telemetryUrl) return;
  telemetryLoading = true;
  renderHud();
  try {
    const url = BRIDGE.telemetryUrl + (force ? '?force=1' : '');
    const resp = await fetch(url, { cache: 'no-store' });
    if (!resp.ok) return;
    const data = await resp.json();
    if (data && data.ok) {
      liveTelemetry = data;
    }
  } catch (e) {} finally {
    telemetryLoading = false;
    renderHud();
    syncStickyMedia();
  }
}

function activeSceneId() {
  return (document.querySelector('.slide.active') || {}).id || (DATA.scenes[0] ? 's-' + DATA.scenes[0].id : '');
}

function renderBridgePill(status) {
  bridgeAgentStatus = status;
  const labelMap = {
    ready: 'Live Copilot Bridge · Ready',
    dispatching: 'Live Copilot Bridge · Dispatching…',
    thinking: 'Live Copilot Bridge · Agent turn active…',
    responded: 'Live Copilot Bridge · Agent replied',
    error: 'Live Copilot Bridge · Error',
  };
  const cls = (status === 'dispatching' || status === 'thinking') ? 'busy' : (status === 'error' ? 'err' : '');
  document.querySelectorAll('[data-bridge-pill]').forEach((el) => {
    el.className = 'bridge-pill ' + cls;
    el.textContent = labelMap[status] || ('Live Copilot Bridge · ' + status);
  });
}

async function sendBridgeCallback(payload) {
  if (!BRIDGE || !BRIDGE.actionUrl || !BRIDGE.token) return { bridged: false };
  const enriched = {
    version: 'v1.0',
    sceneId: activeSceneId(),
    timestampSec: Math.round(now() * 100) / 100,
    oversight: hudOversight,
    ...payload,
  };
  const resp = await fetch(BRIDGE.actionUrl, {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-canvas-token': BRIDGE.token,
    },
    body: JSON.stringify(enriched),
  });
  const body = await resp.json().catch(() => ({ ok: false, error: 'Invalid response' }));
  if (!resp.ok || !body.ok) {
    throw new Error(body.error || ('Bridge HTTP ' + resp.status));
  }
  return { bridged: true, ...body };
}

function connectBridgeEvents() {
  if (!BRIDGE || !BRIDGE.eventsUrl || typeof EventSource !== 'function') return;
  bridgeAgentStatus = 'ready';
  bridgeSource = new EventSource(BRIDGE.eventsUrl);
  bridgeSource.addEventListener('bridge_ready', (ev) => {
    try {
      const msg = JSON.parse(ev.data);
      if (msg.oversight) { hudOversight = msg.oversight; renderHud(); }
      if (msg.liveA2ui && Array.isArray(msg.liveA2ui.messages)) {
        liveA2uiOverride = msg.liveA2ui;
        renderAsk();
      }
      if (msg.lastDeterministicResult) {
        lastDetResult = msg.lastDeterministicResult;
        renderHud();
      }
      renderBridgePill(msg.agentStatus || 'ready');
    } catch (e) {}
  });
  bridgeSource.addEventListener('deterministic_result', (ev) => {
    try {
      const msg = JSON.parse(ev.data);
      if (msg && msg.callbackId) {
        lastDetResult = msg;
        renderHud();
        syncStickyMedia();
      }
    } catch (e) {}
  });
  bridgeSource.addEventListener('callback_ack', (ev) => {
    try {
      const msg = JSON.parse(ev.data);
      if (msg.dispatchedToAgent) renderBridgePill('dispatching');
      const st = $('a2ui-status');
      if (st && msg.displayPrompt) {
        st.classList.remove('err');
        st.textContent = msg.dispatchedToAgent
          ? 'Sent to Copilot agent: ' + msg.displayPrompt
          : 'Handled deterministically: ' + msg.action;
      }
    } catch (e) {}
  });
  bridgeSource.addEventListener('agent_status', (ev) => {
    try {
      const msg = JSON.parse(ev.data);
      renderBridgePill(msg.status || 'ready');
      const st = $('a2ui-status');
      if (st && msg.status === 'error' && msg.error) {
        st.classList.add('err');
        st.textContent = 'Bridge error: ' + msg.error;
      }
    } catch (e) {}
  });
  bridgeSource.addEventListener('a2ui_update', (ev) => {
    try {
      const msg = JSON.parse(ev.data);
      if (Array.isArray(msg.messages) && msg.messages.length) {
        liveA2uiOverride = msg;
        renderAsk();
      }
    } catch (e) {}
  });
  bridgeSource.addEventListener('telemetry_update', (ev) => {
    try {
      const msg = JSON.parse(ev.data);
      if (msg && msg.ok) {
        liveTelemetry = msg;
        renderHud();
        syncStickyMedia();
      }
    } catch (e) {}
  });
  bridgeSource.addEventListener('deck_reloaded', () => {
    window.location.reload();
  });
}

function updateVoiceMeta() {
  const meta = $('voice-meta');
  if (useSystem) {
    meta.classList.add('is-fallback');
    meta.innerHTML = 'audio: <b>system voice fallback</b>';
  } else {
    meta.classList.remove('is-fallback');
    meta.innerHTML = recordedMetaHtml;
  }
}

function updatePlayButtons() {
  $('play').disabled = playing;
  const mp = $('mini-play');
  if (mp) mp.innerHTML = playing ? '&#10074;&#10074; Pause' : '&#9654; Play';
}

function syncStickyMedia() {
  const header = $('sticky-header');
  const fullBar = $('full-bar');
  const mini = $('mini-media');
  if (!header || !fullBar || !mini) return;
  const compact = fullBar.getBoundingClientRect().bottom <= header.getBoundingClientRect().bottom + 4;
  header.classList.toggle('is-compact', compact);
  mini.hidden = !compact;
}

if (typeof IntersectionObserver === 'function') {
  const io = new IntersectionObserver(() => syncStickyMedia(), { threshold: [0, 0.25, 1] });
  io.observe($('full-bar'));
}
window.addEventListener('scroll', syncStickyMedia, { passive: true });
window.addEventListener('resize', syncStickyMedia, { passive: true });

async function renderDiagrams() {
  mermaidRenderSeq += 1;
  const seq = mermaidRenderSeq;
  for (let i = 0; i < DATA.scenes.length; i++) {
    const s = DATA.scenes[i];
    const target = $('d-' + s.id);
    if (!target) continue;
    try {
      const { svg } = await mermaid.render('m-' + seq + '-' + s.id, s.mermaid);
      target.innerHTML = svg;
      // Ensure author-specified pastel fills keep dark legible text even in dark mode
      if (darkTheme) {
        target.querySelectorAll('g.node').forEach((g) => {
          const shape = g.querySelector('rect, polygon, circle, path');
          if (!shape) return;
          const fill = (shape.getAttribute('style') || '') + ' ' + (shape.getAttribute('fill') || '');
          const m = fill.match(/#([0-9a-f]{6})/i);
          if (m) {
            const n = parseInt(m[1], 16);
            const lum = 0.299 * ((n >> 16) & 255) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255);
            if (lum > 165) {
              g.querySelectorAll('.nodeLabel, span, p, text').forEach((el) => {
                el.style.color = '#161922';
                el.style.fill = '#161922';
              });
            }
          }
        });
      }
    } catch (e) {
      target.textContent = 'diagram failed: ' + e.message;
    }
  }
}

async function build() {
  const host = $('slides');
  for (let i = 0; i < DATA.scenes.length; i++) {
    const s = DATA.scenes[i];
    const el = document.createElement('section');
    el.className = 'slide'; el.id = 's-' + s.id;
    el.innerHTML = '<div class="n">Scene ' + (i+1) + ' of ' + DATA.scenes.length +
                   ' &middot; ' + fmt(s.start) + '</div><h2>' + esc(s.title) + '</h2>' +
                   '<div class="diagram" id="d-' + s.id + '"></div>';
    host.appendChild(el);
  }
  await renderDiagrams();
}

// Re-sync Mermaid and theme classes whenever Copilot App switches light/dark mode
if (typeof MutationObserver === 'function') {
  const themeObserver = new MutationObserver(() => {
    const prev = darkTheme;
    const next = detectDarkMode();
    if (next !== prev) {
      syncThemeClass();
      renderDiagrams();
    }
  });
  themeObserver.observe(document.documentElement, { attributes: true, attributeFilter: ['data-color-mode', 'style'] });
  if (document.body) {
    themeObserver.observe(document.body, { attributes: true, attributeFilter: ['data-color-mode', 'style'] });
  }
}
if (window.matchMedia) {
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  const onMq = () => {
    const prev = darkTheme;
    if (detectDarkMode() !== prev) {
      syncThemeClass();
      renderDiagrams();
    }
  };
  if (mq.addEventListener) mq.addEventListener('change', onMq);
}

function renderDetResultHtml() {
  if (!lastDetResult) return '';
  const r = lastDetResult;
  const d = r.data || {};
  const bullets = [];
  if (r.kind === 'unblock_issue') {
    (d.directBlockers || []).forEach((b) => {
      bullets.push('<li><b>Blocker #' + esc(b.number) + '</b> (' + esc(b.readyNow ? 'READY NOW' : ('blocked by ' + (b.blockedBy || []).map((n) => '#' + n).join(', '))) + '): ' + esc(b.title) + '</li>');
    });
    if ((d.actionableRootLeaves || []).length) {
      bullets.push('<li><b>Actionable root leaf(s):</b> ' + d.actionableRootLeaves.map((l) => '#' + esc(l.number) + ' — ' + esc(l.title)).join('; ') + '</li>');
    }
  } else if (r.kind === 'triage_bottleneck') {
    const c = d.counts || {};
    bullets.push('<li><b>Verdict:</b> ' + esc(d.recommendation) + '</li>');
    bullets.push('<li><b>Split:</b> ' + esc(c.actionableNow) + ' actionable now · ' + esc(c.prodGated) + ' prod-gated (' + esc(c.prodGatedPercent) + '%) · ' + esc(c.blocked) + ' upstream-blocked</li>');
    if ((d.rootUnblockerLeaves || []).length) {
      bullets.push('<li><b>Critical-path root unblocker(s):</b> ' + d.rootUnblockerLeaves.map((l) => '#' + esc(l.number) + ' (unlocks ' + l.unlocks.map((n) => '#' + n).join(', ') + ')').join('; ') + '</li>');
    }
  } else if (r.kind === 'assign_next_item') {
    bullets.push('<li><b>Verified ready:</b> ' + (d.verifiedReady ? 'YES (0 blockers, 0 conflicting open PRs)' : 'NO') + '</li>');
  }
  const formula = d.formulaMatched || '';
  return '<div class="det-result" id="det-result" role="region" aria-label="Deterministic execution result">' +
    '<div class="det-head">' +
      '<span class="det-title">' + esc(r.title || ('Deterministic Result · ' + r.action)) + '</span>' +
      '<div class="det-badges">' +
        '<span class="prov-chip live">0 LLM tokens &middot; Deterministic Node</span>' +
        '<span class="prov-chip">' + esc(r.callbackId) + ' &middot; ' + esc(formatClockTime(r.measuredAt || r.timestamp)) + '</span>' +
      '</div>' +
    '</div>' +
    '<p class="det-summary">' + esc(r.summary || r.error || '') + '</p>' +
    (formula ? '<div class="det-formula">Rule matched: ' + esc(formula) + '</div>' : '') +
    (bullets.length ? '<ul class="det-list">' + bullets.join('') + '</ul>' : '') +
    '<div class="det-actions">' +
      (r.ok && r.handoffPrompt ? '<button type="button" class="node-btn primary" id="det-send-agent-btn">Send verified dossier to Agent</button>' : '') +
      '<button type="button" class="node-btn" id="det-dismiss-btn">Dismiss</button>' +
    '</div>' +
    '<details class="det-raw"><summary>Inspect raw deterministic receipt JSON (' + esc((r.sources || []).join(', ')) + ')</summary>' +
    '<pre>' + esc(JSON.stringify(r, null, 2)) + '</pre></details>' +
  '</div>';
}

function renderHud() {
  const h = DATA.hud || {};
  const host = $('hud');
  if (!host) return;
  if (!BRIDGE && !DATA.hud) return;

  // In live Copilot Extension Canvas mode, stats/nodes/artifacts come strictly from
  // deterministic live telemetry (never stale authored numbers from timeline.json).
  const useLive = Boolean(BRIDGE);
  const stats = useLive ? (liveTelemetry ? (liveTelemetry.stats || []) : []) : (h.stats || []);
  const allNodes = useLive ? (liveTelemetry ? (liveTelemetry.nodes || []) : []) : (h.nodes || []);
  const artifacts = useLive ? (liveTelemetry ? (liveTelemetry.artifacts || []) : []) : (h.artifacts || []);

  const visibleNodes = hudOversight === 'executive'
    ? allNodes.filter((n) => n.level === 'lead' || n.level === 'video' || n.state === 'bottleneck')
    : allNodes;

  // Integrated single-row scrollable tab-header strip inside the same .hud container
  const tabsHtml = (useLive && discoveredPacks.length)
    ? '<div class="hud-tabbar">' +
        '<div class="hud-tabstrip" role="tablist" aria-label="Agent artifact packs">' +
          discoveredPacks.map((p) => {
            const dur = typeof p.totalDuration === 'number' ? fmt(p.totalDuration) : '';
            const meta = [p.sceneCount ? p.sceneCount + ' scenes' : '', dur, p.issue ? '#' + p.issue : ''].filter(Boolean).join(' · ');
            return '<button type="button" role="tab" aria-selected="' + (p.active ? 'true' : 'false') + '" class="hud-tab' + (p.active ? ' active' : '') + '" data-pack-dir="' + esc(p.deckDir) + '" data-pack-id="' + esc(p.id) + '" title="' + esc(p.title) + '">' +
              '<div class="hud-tab-top"><span class="hud-tab-kind">' + esc(formatPackKind(p.kind)) + '</span><span class="hud-tab-meta">' + esc(meta) + '</span></div>' +
              '<div class="hud-tab-name">' + esc(p.title) + '</div>' +
            '</button>';
          }).join('') +
        '</div>' +
        '<div class="hud-tabtools">' +
          '<span class="bridge-pill" data-bridge-pill>Live Copilot Bridge &middot; Ready</span>' +
          '<button type="button" class="hud-refresh" id="hud-refresh-btn"' + (telemetryLoading ? ' disabled' : '') + '>' + (telemetryLoading ? 'Refreshing…' : 'Refresh live') + '</button>' +
        '</div>' +
      '</div>'
    : (useLive
      ? '<div class="hud-tabbar"><span class="hud-title" style="padding-bottom:10px;">A-HUD &middot; Live Landscape</span>' +
          '<div class="hud-tabtools">' +
            '<span class="bridge-pill" data-bridge-pill>Live Copilot Bridge &middot; Ready</span>' +
            '<button type="button" class="hud-refresh" id="hud-refresh-btn"' + (telemetryLoading ? ' disabled' : '') + '>' + (telemetryLoading ? 'Refreshing…' : 'Refresh live') + '</button>' +
          '</div></div>'
      : '');

  let provHtml = '';
  if (useLive) {
    if (liveTelemetry) {
      const f = liveTelemetry.packFreshness || {};
      const chips = [
        '<span class="prov-chip live">Live deterministic &middot; ' + esc(formatClockTime(liveTelemetry.measuredAt)) + '</span>',
        liveTelemetry.branch && liveTelemetry.headSha
          ? '<span class="prov-chip">' + esc(liveTelemetry.branch + ' @ ' + liveTelemetry.headSha) + '</span>'
          : '',
        f.stale && f.packCommit
          ? '<span class="prov-chip stale">Pack recorded @ ' + esc(f.packCommit.slice(0, 8)) + ' (repo moved)</span>'
          : '',
        liveTelemetry.sources && liveTelemetry.sources.length
          ? '<span class="prov-chip">Sources: ' + esc(liveTelemetry.sources.join(', ')) + '</span>'
          : '',
      ].filter(Boolean);
      provHtml = '<div class="hud-prov">' + chips.join('') + '</div>';
    } else {
      provHtml = '<div class="hud-prov"><span class="prov-chip">Measuring live repo, queue, PR, and artifact telemetry…</span></div>';
    }
  } else {

const HAS_MASTER_AUDIO = Boolean(DATA.master_audio);
if (HAS_MASTER_AUDIO) {
  player.src = DATA.master_audio;
}

function now() {
  if (useSystem) return sysOffset + (performance.now() - sysStart) / 1000;
  if (HAS_MASTER_AUDIO) {
    if (playing && !player.paused && Number.isFinite(player.currentTime)) {
      wallBase = player.currentTime;
      return player.currentTime;
    }
    return wallBase;
  }
  if (!playing && pending === null) return wallBase;
  if (playing && pending === null && sceneIdx >= 0 && Number.isFinite(player.currentTime)) {
    const sc = DATA.scenes[sceneIdx];
    if (sc) return Math.min(sc.start + sc.duration, sc.start + player.currentTime);
  }
  return wallBase + (performance.now() - wallStart) / 1000;
}

// When master_audio is present, a single continuous <audio> stream is the
// authoritative clock — zero src reloads, zero buffer gaps, zero chopped edges.
function syncAudio(t) {
  if (useSystem) return;
  if (HAS_MASTER_AUDIO) {
    if (!player.src || player.src.indexOf(DATA.master_audio) < 0) {
      pending = t;
      player.src = DATA.master_audio;
      return;
    }
    if (pending !== null) return;
    if (!playing && Math.abs(player.currentTime - t) > 0.15) {
      try { player.currentTime = t; } catch (e) {}
    }
    return;
  }
  let i = 0;
  for (let k = 0; k < DATA.scenes.length; k++) if (t >= DATA.scenes[k].start) i = k;
  const sc = DATA.scenes[i];
  const want = Math.max(0, t - sc.start);
  if (i !== sceneIdx || !player.src || player.src.indexOf(sc.audio) < 0) {
    sceneIdx = i; pending = t; player.src = sc.audio; return;
  }
  if (pending !== null) return;
  if (Math.abs(player.currentTime - want) > 0.65) { player.currentTime = want; }
}

player.addEventListener('loadedmetadata', () => {
  if (pending === null) return;
  const t = pending; pending = null;
  if (HAS_MASTER_AUDIO) {
    player.currentTime = Math.max(0, Math.min(DATA.total - 0.05, t));
  } else {
    let i = 0;
    for (let k = 0; k < DATA.scenes.length; k++) if (t >= DATA.scenes[k].start) i = k;
    player.currentTime = Math.max(0, t - DATA.scenes[i].start);
  }
  wallBase = t; wallStart = performance.now();
  if (playing) player.play().catch(() => {});
  idx = -1; tick();
});

player.addEventListener('ended', () => {
  if (HAS_MASTER_AUDIO) {
    wallBase = DATA.total;
    pause();
    tick();
    return;
  }
  const next = DATA.scenes[sceneIdx + 1];
  if (next) seek(next.start); else pause();
});

function seek(t) {
  t = Math.max(0, Math.min(DATA.total - 0.05, t));
  wallBase = t; wallStart = performance.now(); idx = -1;
  if (useSystem) {
    sysOffset = t; sysStart = performance.now(); sysScene = -1;
    if (playing) speakFrom(t);
  } else if (HAS_MASTER_AUDIO) {
    if (player.readyState >= 1) {
      pending = null;
      player.currentTime = t;
    } else {
      pending = t;
      syncAudio(t);
    }
  } else {
    pending = t;
    syncAudio(t);
  }
  tick();
}

function tick() {
  const t = now();
  if (!useSystem && pending === null) syncAudio(t);
  const ratio = Math.max(0, Math.min(1, DATA.total > 0 ? t / DATA.total : 0));
  const clk = fmt(t) + ' / ' + fmt(DATA.total);
  $('fill').style.transform = 'scaleX(' + ratio.toFixed(4) + ')';
  $('clock').textContent = clk;
  if ($('mini-fill')) $('mini-fill').style.transform = 'scaleX(' + ratio.toFixed(4) + ')';
  if ($('mini-clock')) $('mini-clock').textContent = clk;

  let si = 0;
  for (let i = 0; i < DATA.scenes.length; i++) if (t >= DATA.scenes[i].start) si = i;
  if (si !== idx) {
    idx = si;
    document.querySelectorAll('.slide').forEach((n) => n.classList.remove('active'));
    const el = $('s-' + DATA.scenes[si].id);
    if (el) {
      el.classList.add('active');
      if (playing) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }

  const cue = DATA.cues.find((c) => t >= c.t && t < c.end);
  const cap = $('cap');
  const text = cue ? cue.text : '';
  if (cap.dataset.t !== text) {
    cap.classList.remove('on');
    setTimeout(() => { cap.textContent = text; cap.classList.add('on'); }, 90);
    cap.dataset.t = text;
  }
  syncStickyMedia();
  if (playing) raf = requestAnimationFrame(tick);
}

function speakFrom(t) {
  let i = 0;
  for (let k = 0; k < DATA.scenes.length; k++) if (t >= DATA.scenes[k].start) i = k;
  const sc = DATA.scenes[i];
  sysScene = i;
  const u = new SpeechSynthesisUtterance(sc.narration);
  u.rate = 1.02;
  u.onend = () => {
    const next = DATA.scenes[sysScene + 1];
    if (next && playing) { sysOffset = next.start; sysStart = performance.now(); speakFrom(next.start); }
    else if (!next) pause();
  };
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
  sysOffset = t; sysStart = performance.now();
}

function play() {
  if (playing) return;
  if (wallBase >= DATA.total - 0.1) wallBase = 0;
  setFooterLiveChat(null);
  playing = true;
  updatePlayButtons();
  wallStart = performance.now();
  if (useSystem) {
    speakFrom(now());
  } else if (HAS_MASTER_AUDIO) {
    if (!player.src || player.src.indexOf(DATA.master_audio) < 0) {
      pending = wallBase;
      player.src = DATA.master_audio;
    } else if (player.readyState >= 1) {
      pending = null;
      if (Math.abs(player.currentTime - wallBase) > 0.1) {
        try { player.currentTime = wallBase; } catch (e) {}
      }
      player.play().catch(() => {
        useSystem = true; $('voicebtn').textContent = 'Use recorded audio'; updateVoiceMeta(); speakFrom(now());
      });
    } else {
      pending = wallBase;
    }
  } else if (!player.src) {
    pending = wallBase; syncAudio(wallBase);
  } else {
    player.play().catch(() => {
      useSystem = true; $('voicebtn').textContent = 'Use recorded audio'; updateVoiceMeta(); speakFrom(now());
    });
  }
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(tick);
}

function pause() {
  if (!playing && pending === null) return;
  wallBase = now();
  playing = false;
  updatePlayButtons();
  cancelAnimationFrame(raf);
  if (useSystem) { speechSynthesis.cancel(); sysOffset = wallBase; }
  else player.pause();
}

function restart() {
  pause();
  wallBase = 0; sysOffset = 0; sysScene = -1; pending = null;
  sceneIdx = -1; idx = -1;
  if (player.src) player.currentTime = 0;
  $('fill').style.transform = 'scaleX(0)';
  if ($('mini-fill')) $('mini-fill').style.transform = 'scaleX(0)';
  tick();
  play();
}

$('play').onclick = play;
$('pause').onclick = pause;
$('restart').onclick = restart;
$('mini-play').onclick = () => { playing ? pause() : play(); };
function bindTrackSeek(trackEl) {
  if (!trackEl) return;
  trackEl.addEventListener('click', (e) => {
    const r = trackEl.getBoundingClientRect();
    const frac = Math.max(0, Math.min(1, (e.clientX - r.left) / Math.max(1, r.width)));
    seek(frac * DATA.total);
  });
}
bindTrackSeek($('full-track'));
bindTrackSeek($('mini-track'));

$('voicebtn').onclick = () => {
  const wasPlaying = playing;
  const at = now();
  pause();
  useSystem = !useSystem;
  $('voicebtn').textContent = useSystem ? 'Use recorded audio' : 'Use system voice';
  updateVoiceMeta();
  sysOffset = at; sysScene = -1; sceneIdx = -1;
  if (wasPlaying) play();
};

document.addEventListener('keydown', (e) => {
  if (e.target && e.target.closest && e.target.closest('button, input, textarea, select, a, summary')) return;
  if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
  if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') {
    e.preventDefault();
    const t = now();
    let i = 0;
    for (let k = 0; k < DATA.scenes.length; k++) if (t >= DATA.scenes[k].start) i = k;
    const j = Math.max(0, Math.min(DATA.scenes.length - 1, i + (e.code === 'ArrowRight' ? 1 : -1)));
    seek(DATA.scenes[j].start);
  }
});

function buildDefaultA2ui(d) {
  const surfaceId = 'walkthrough-disposition';
  const components = [
    { id: 'root', component: 'Column', children: ['prompt', 'note', 'actions'] },
    { id: 'prompt', component: 'Text', text: d.prompt, variant: 'h3' },
    { id: 'note', component: 'Text', text: d.note || '', variant: 'body' },
    { id: 'actions', component: 'Row', children: d.options.map((_, i) => 'opt-' + i) },
  ];
  d.options.forEach((opt, i) => {
    components.push({ id: 'opt-' + i + '-label', component: 'Text', text: opt });
    components.push({
      id: 'opt-' + i,
      component: 'Button',
      variant: i === 0 ? 'primary' : 'secondary',
      child: 'opt-' + i + '-label',
      action: { name: 'select_option', context: { option: opt, index: i } },
    });
  });
  return [
    { version: 'v1.0', createSurface: { surfaceId, catalogId: 'https://a2ui.org/specification/v1_0/basic_catalog.json' } },
    { version: 'v1.0', updateComponents: { surfaceId, components } },
  ];
}

// Render the disposition / A2UI v1.0 action surface so choices follow A2UI JSON.
function renderAsk() {
  const d = DATA.disposition;
  const activeMessages = (liveA2uiOverride && Array.isArray(liveA2uiOverride.messages) && liveA2uiOverride.messages.length)
    ? liveA2uiOverride.messages
    : (Array.isArray(DATA.a2ui) && DATA.a2ui.length ? DATA.a2ui : (d ? buildDefaultA2ui(d) : null));
  if (!d && !activeMessages) return;
  const ask = $('ask');

  const createMsg = activeMessages.find((m) => m.createSurface);
  const compMsg = activeMessages.find((m) => m.updateComponents);
  const surfaceId = (createMsg && createMsg.createSurface && createMsg.createSurface.surfaceId) || 'walkthrough-disposition';
  const byId = new Map(((compMsg && compMsg.updateComponents && compMsg.updateComponents.components) || []).map((c) => [c.id, c]));
  const buttons = [...byId.values()].filter((c) => c.component === 'Button');
  const firstHeading = [...byId.values()].find((c) => c.component === 'Text' && (c.variant === 'h3' || c.id === 'prompt' || c.id === 'h' || c.id === 'p'));
  const heading = (liveA2uiOverride && firstHeading && firstHeading.text) || (d && d.prompt) || (firstHeading && firstHeading.text) || 'Next action';
  const note = (liveA2uiOverride && liveA2uiOverride.statusNote) || (d && d.note) || (byId.get('note') && byId.get('note').text) || '';
  const catalog = (createMsg && createMsg.createSurface && createMsg.createSurface.catalogId) || 'a2ui/v1.0';

  const renderedButtons = buttons.length
    ? buttons.map((btn) => {
        const labelComp = byId.get(btn.child);
        const label = (labelComp && labelComp.text) || btn.id;
        const actionJson = esc(JSON.stringify(btn.action || { name: 'select_option', context: { option: label } }));
        return '<button type="button" class="' + (btn.variant === 'primary' ? 'primary' : '') +
               '" data-component-id="' + esc(btn.id) + '" data-answer="' + esc(label) +
               '" data-a2ui-action="' + actionJson + '">' + esc(label) + '</button>';
      }).join('')
    : (d ? d.options.map((o, i) => '<button type="button" data-component-id="opt-' + i + '" data-answer="' + esc(o) + '">' + esc(o) + '</button>').join('') : '');

  ask.innerHTML =
    '<div class="ask-head"><h3>' + esc(heading) + '</h3>' +
      '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">' +
        (BRIDGE ? '<span class="bridge-pill" data-bridge-pill>Live Copilot Bridge &middot; Ready</span>' : '') +
        '<span class="a2ui-badge">A2UI v1.0 &middot; ' + esc(catalog) + '</span>' +
      '</div>' +
    '</div>' +
    (note ? '<p>' + esc(note) + '</p>' : '') +
    '<div class="opts">' + renderedButtons + '</div>' +
    (BRIDGE
      ? '<form class="steer-row" id="steer-form"><input class="steer-input" id="steer-input" type="text" placeholder="Or send a direct note to the agent from this scene…" aria-label="Message agent"><button type="submit" class="primary">Send to Agent</button></form>'
      : '') +
    '<div class="a2ui-status" id="a2ui-status" role="status"></div>' +
    '<p class="tip">' +
      (BRIDGE
        ? 'Clicks run the deterministic JS callback in the Copilot Extension Canvas and <b>wake the agent directly</b>.'
        : 'Pick an A2UI action to copy it into chat. <b>Or just say it however you like</b> &mdash; typing or the microphone both work, and no answer is a valid answer.') +
    '</p>' +
    '<details class="a2ui-raw" id="a2ui-json-drawer"><summary>Inspect A2UI v1.0 JSON payload (' + activeMessages.length + ' messages)</summary>' +
    '<pre id="a2ui-json-pre">' + esc(JSON.stringify(activeMessages, null, 2)) + '</pre></details>';
  ask.hidden = false;
  if (BRIDGE) renderBridgePill(bridgeAgentStatus === 'standalone' ? 'ready' : bridgeAgentStatus);

  ask.querySelectorAll('button[data-answer]').forEach((b) => {
    b.onclick = async () => {
      const text = b.dataset.answer;
      const sourceComponentId = b.dataset.componentId || undefined;
      const act = b.dataset.a2uiAction ? JSON.parse(b.dataset.a2uiAction) : { name: 'select_option', context: { option: text } };
      const a2uiPayload = {
        version: 'v1.0',
        label: text,
        action: { ...act, surfaceId, ...(sourceComponentId ? { sourceComponentId } : {}) },
      };
      lastA2uiAction = a2uiPayload;
      window.dispatchEvent(new CustomEvent('a2ui:action', { detail: a2uiPayload }));

      if (BRIDGE) {
        pauseForLiveChat(text);
        b.disabled = true;
        try {
          const res = await sendBridgeCallback(a2uiPayload);
          b.classList.add('copied');
          b.textContent = res.dispatchedToAgent ? 'sent to agent' : 'updated';
          setTimeout(() => { b.classList.remove('copied'); b.textContent = text; }, 2200);
        } catch (err) {
          const st = $('a2ui-status');
          if (st) { st.classList.add('err'); st.textContent = 'Callback failed: ' + err.message; }
        } finally {
          b.disabled = false;
        }
        return;
      }

      try { await navigator.clipboard.writeText(text); } catch (e) {}
      b.classList.add('copied');
      b.textContent = 'copied — paste in chat';
      setTimeout(() => { b.classList.remove('copied'); b.textContent = text; }, 2200);
    };
  });

  const form = $('steer-form');
  if (form && BRIDGE) {
    form.onsubmit = async (ev) => {
      ev.preventDefault();
      const inp = $('steer-input');
      const noteText = (inp && inp.value || '').trim();
      if (!noteText) return;
      pauseForLiveChat('Direct note');
      const btn = form.querySelector('button[type="submit"]');
      if (btn) btn.disabled = true;
      try {
        await sendBridgeCallback({
          label: noteText,
          userNote: noteText,
          action: { name: 'reply_custom', surfaceId, sourceComponentId: 'steer-form', context: { message: noteText } },
        });
        inp.value = '';
      } catch (err) {
        const st = $('a2ui-status');
        if (st) { st.classList.add('err'); st.textContent = 'Callback failed: ' + err.message; }
      } finally {
        if (btn) btn.disabled = false;
      }
    };
  }
}

window.seek = seek;
window.state = () => ({
  t: now(), playing, useSystem, scene: (document.querySelector('.slide.active') || {}).id,
  caption: $('cap').textContent, askShown: !$('ask').hidden,
  hudShown: !$('hud').hidden, hudOversight,
  stickyCompact: $('sticky-header').classList.contains('is-compact'),
  miniMediaVisible: !$('mini-media').hidden,
  bridgeConnected: Boolean(BRIDGE),
  bridgeAgentStatus,
  packCount: discoveredPacks.length,
  liveTelemetryMeasuredAt: liveTelemetry ? liveTelemetry.measuredAt : null,
  liveChatTarget,
  lastA2uiAction,
});

build();
renderHud();
renderAsk();
connectBridgeEvents();
loadPacks();
loadTelemetry(false);
updateVoiceMeta();
updatePlayButtons();
tick();
syncStickyMedia();
</script>
</body>
</html>
