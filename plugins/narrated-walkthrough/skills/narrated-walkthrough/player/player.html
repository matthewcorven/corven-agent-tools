<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>__TITLE__</title>
__MERMAID__
<style>
  :root {
    color-scheme: light dark;
    --surface: var(--background-color-default, #ffffff);
    --ink: var(--text-color-default, #1b1b1f);
    --dim: var(--text-color-muted, #6b6b76);
    --line: var(--border-color-default, #e3e3ea);
    --bg: color-mix(in srgb, var(--surface) 97%, var(--ink));
    --surface-sub: color-mix(in srgb, var(--surface) 94%, var(--ink));
    --surface-hover: color-mix(in srgb, var(--surface) 88%, var(--ink));
    --chrome-bg: color-mix(in srgb, var(--surface) 93%, transparent);
    --control-bg: color-mix(in srgb, var(--surface) 96%, var(--ink));
    --track-bg: color-mix(in srgb, var(--ink) 12%, var(--surface));
    --pill-bg: color-mix(in srgb, var(--ink) 7%, var(--surface));
    --shadow-sm: 0 1px 3px rgba(0,0,0,.08);
    --shadow-md: 0 4px 16px rgba(0,0,0,.08);
    --shadow-lg: 0 10px 28px rgba(0,0,0,.09);

    --accent: #3d6fd0;
    --accent-ink: #ffffff;
    --accent-soft-bg: #eef4ff;
    --accent-soft-ink: #2a56b3;
    --accent-soft-border: #c9dafc;

    --ok-bg: #e8f6ec;
    --ok-ink: #1f6b38;
    --ok-border: #bfe3c9;

    --warn-bg: #fff4e5;
    --warn-ink: #9a5b08;
    --warn-border: #f0d3a5;

    --err-bg: #fdecec;
    --err-ink: #b42318;
    --err-border: #f5c2c0;

    --lead-bg: #f5f8ff;
    --lead-border: #b8cdf5;
    --video-bg: #f3fbf5;
    --video-border: #bfe3c9;

    --ask-bg: #fffdf6;
    --ask-border: #e8d9a8;
    --ask-divider: #efe4be;

    --code-bg: #161b22;
    --code-ink: #e6edf3;
    --status-bar-color: var(--background-color-default, #ffffff);
  }

  :root[data-color-mode="dark"],
  body[data-color-mode="dark"],
  :root.is-dark {
    color-scheme: dark;
    --surface: var(--background-color-default, #0d1117);
    --ink: var(--text-color-default, #e6edf3);
    --dim: var(--text-color-muted, #8b949e);
    --line: var(--border-color-default, #30363d);
    --bg: color-mix(in srgb, var(--surface) 94%, #000000);
    --surface-sub: color-mix(in srgb, var(--surface) 93%, #ffffff);
    --surface-hover: color-mix(in srgb, var(--surface) 88%, #ffffff);
    --chrome-bg: color-mix(in srgb, var(--surface) 92%, transparent);
    --control-bg: color-mix(in srgb, var(--surface) 91%, #ffffff);
    --track-bg: color-mix(in srgb, #ffffff 14%, var(--surface));
    --pill-bg: color-mix(in srgb, #ffffff 8%, var(--surface));
    --shadow-sm: 0 1px 4px rgba(0,0,0,.35);
    --shadow-md: 0 4px 18px rgba(0,0,0,.45);
    --shadow-lg: 0 10px 30px rgba(0,0,0,.5);

    --accent: #58a6ff;
    --accent-ink: #0d1117;
    --accent-soft-bg: rgba(88,166,255,.14);
    --accent-soft-ink: #79c0ff;
    --accent-soft-border: rgba(88,166,255,.35);

    --ok-bg: rgba(63,185,80,.15);
    --ok-ink: #7ee787;
    --ok-border: rgba(63,185,80,.38);

    --warn-bg: rgba(210,153,34,.16);
    --warn-ink: #f0b72f;
    --warn-border: rgba(210,153,34,.4);

    --err-bg: rgba(248,81,73,.15);
    --err-ink: #ff7b72;
    --err-border: rgba(248,81,73,.4);

    --lead-bg: rgba(88,166,255,.09);
    --lead-border: rgba(88,166,255,.35);
    --video-bg: rgba(63,185,80,.09);
    --video-border: rgba(63,185,80,.35);

    --ask-bg: color-mix(in srgb, var(--surface) 92%, #d29922);
    --ask-border: rgba(210,153,34,.42);
    --ask-divider: rgba(210,153,34,.24);

    --code-bg: #090d13;
    --code-ink: #e6edf3;
    --status-bar-color: var(--background-color-default, #0d1117);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-color-mode="light"]) {
      color-scheme: dark;
      --surface: var(--background-color-default, #0d1117);
      --ink: var(--text-color-default, #e6edf3);
      --dim: var(--text-color-muted, #8b949e);
      --line: var(--border-color-default, #30363d);
      --bg: color-mix(in srgb, var(--surface) 94%, #000000);
      --surface-sub: color-mix(in srgb, var(--surface) 93%, #ffffff);
      --surface-hover: color-mix(in srgb, var(--surface) 88%, #ffffff);
      --chrome-bg: color-mix(in srgb, var(--surface) 92%, transparent);
      --control-bg: color-mix(in srgb, var(--surface) 91%, #ffffff);
      --track-bg: color-mix(in srgb, #ffffff 14%, var(--surface));
      --pill-bg: color-mix(in srgb, #ffffff 8%, var(--surface));
      --shadow-sm: 0 1px 4px rgba(0,0,0,.35);
      --shadow-md: 0 4px 18px rgba(0,0,0,.45);
      --shadow-lg: 0 10px 30px rgba(0,0,0,.5);

      --accent: #58a6ff;
      --accent-ink: #0d1117;
      --accent-soft-bg: rgba(88,166,255,.14);
      --accent-soft-ink: #79c0ff;
      --accent-soft-border: rgba(88,166,255,.35);

      --ok-bg: rgba(63,185,80,.15);
      --ok-ink: #7ee787;
      --ok-border: rgba(63,185,80,.38);

      --warn-bg: rgba(210,153,34,.16);
      --warn-ink: #f0b72f;
      --warn-border: rgba(210,153,34,.4);

      --err-bg: rgba(248,81,73,.15);
      --err-ink: #ff7b72;
      --err-border: rgba(248,81,73,.4);

      --lead-bg: rgba(88,166,255,.09);
      --lead-border: rgba(88,166,255,.35);
      --video-bg: rgba(63,185,80,.09);
      --video-border: rgba(63,185,80,.35);

      --ask-bg: color-mix(in srgb, var(--surface) 92%, #d29922);
      --ask-border: rgba(210,153,34,.42);
      --ask-divider: rgba(210,153,34,.24);

      --code-bg: #090d13;
      --code-ink: #e6edf3;
      --status-bar-color: var(--background-color-default, #0d1117);
    }
  }

  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.55 var(--font-sans, -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif);
         color:var(--ink); background:var(--bg); }
  header { display:flex; align-items:center; gap:14px; padding:12px 22px;
           border-bottom:1px solid var(--line); background:var(--chrome-bg);
           backdrop-filter:blur(8px); position:sticky; top:0; z-index:10;
           transition:box-shadow .2s ease; }
  header.is-compact { box-shadow:var(--shadow-md); }
  header h1 { font-size:15px; margin:0; font-weight:650; letter-spacing:.01em; white-space:nowrap;
              overflow:hidden; text-overflow:ellipsis; color:var(--ink); }
  .mini-media { display:flex; align-items:center; gap:10px; flex:1 1 260px; max-width:440px;
                margin-left:8px; opacity:0; transform:translateY(-3px);
                transition:opacity .18s ease, transform .18s ease; }
  header.is-compact .mini-media { opacity:1; transform:none; }
  .mini-media[hidden] { display:none; }
  .mini-btn { font:inherit; font-size:12px; padding:5px 12px; border-radius:999px;
              background:var(--accent); border:1px solid var(--accent); color:var(--accent-ink);
              font-weight:600; cursor:pointer; white-space:nowrap; }
  .mini-track { flex:1 1 120px; height:6px; background:var(--track-bg); border-radius:999px;
                overflow:hidden; cursor:pointer; min-width:90px; }
  .mini-track > i { display:block; height:100%; width:100%; background:var(--accent);
                    transform-origin:left center; transform:scaleX(0); transition:transform .18s linear; }
  .mini-clock { font-variant-numeric:tabular-nums; font-size:12px; color:var(--dim);
                white-space:nowrap; min-width:74px; text-align:right; }
  header .meta { font-size:12px; color:var(--dim); margin-left:auto; white-space:nowrap;
                 display:inline-flex; align-items:center; gap:6px; flex-shrink:0; }
  header .meta.is-fallback { color:var(--warn-ink); font-weight:600; }
  .vc-label { font-size:11.5px; color:var(--dim); font-weight:600; }
  .vc-select { font:inherit; font-size:11.5px; font-weight:600; padding:3px 7px; border-radius:7px;
               border:1px solid var(--line); background:var(--control-bg); color:var(--ink);
               cursor:pointer; max-width:210px; text-overflow:ellipsis; }
  .vc-select.vc-voice { max-width:118px; }
  .vc-select:hover:not(:disabled) { border-color:var(--accent); }
  .vc-select:disabled { opacity:.55; cursor:default; }
  .vc-regen-btn { display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px;
                  padding:0; border-radius:7px; border:1px solid var(--line); background:var(--control-bg);
                  color:var(--ink); cursor:pointer; flex-shrink:0;
                  transition:border-color .14s ease, background .14s ease, color .14s ease; }
  .vc-regen-btn:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
  .vc-regen-btn:disabled { opacity:.6; cursor:default; }
  .vc-regen-btn svg { width:14px; height:14px; display:block; }
  @keyframes vc-spin { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
  .vc-regen-btn.is-spinning { border-color:var(--accent-soft-border); background:var(--accent-soft-bg);
                              color:var(--accent-soft-ink); }
  .vc-regen-btn.is-spinning svg { animation:vc-spin .9s linear infinite; }
  .vc-status { font-size:11px; font-weight:650; padding:2px 7px; border-radius:999px;
               border:1px solid var(--line); background:var(--pill-bg); color:var(--dim);
               max-width:185px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .vc-status.is-busy { background:var(--accent-soft-bg); color:var(--accent-soft-ink); border-color:var(--accent-soft-border); }
  .vc-status.is-done { background:var(--ok-bg); color:var(--ok-ink); border-color:var(--ok-border); }
  .vc-status.is-err { background:var(--err-bg); color:var(--err-ink); border-color:var(--err-border); }
  main { max-width:1080px; margin:0 auto; padding:24px 22px 148px; overflow-anchor:none; }
  main.has-queue { max-width:1380px; }
  .hud, .workspace, .stage-pane { overflow-anchor:none; }
  .workspace { display:block; }
  .workspace.has-queue { display:grid; grid-template-columns:320px minmax(0,1fr); gap:18px; align-items:start; }
  @media (max-width:960px) {
    .workspace.has-queue { grid-template-columns:1fr; }
    .queue-pane { position:static !important; max-height:none !important; }
  }
  .queue-pane { background:var(--surface); border:1px solid var(--line); border-radius:14px;
                position:sticky; top:68px; max-height:calc(100vh - 178px);
                display:flex; flex-direction:column; overflow:hidden; }
  .queue-pane[hidden] { display:none; }
  .queue-head { display:flex; align-items:center; justify-content:space-between; gap:8px;
                padding:12px 14px 10px; border-bottom:1px solid var(--line); background:var(--surface-sub); }
  .queue-title { font-size:11.5px; text-transform:uppercase; letter-spacing:.09em; color:var(--dim); font-weight:700; }
  .queue-count { font-size:11px; padding:2px 7px; border-radius:999px; background:var(--pill-bg);
                 color:var(--dim); border:1px solid var(--line); font-weight:600; }
  .queue-controls { padding:10px 12px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:8px; }
  .queue-cats { display:flex; gap:5px; flex-wrap:wrap; }
  .qcat-btn { font-size:11px; padding:4px 8px; border-radius:999px; border:1px solid var(--line);
              background:var(--control-bg); color:var(--dim); font-weight:600; }
  .qcat-btn.on { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .queue-selects { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .queue-select { font:inherit; font-size:11.5px; padding:5px 7px; border-radius:7px;
                  border:1px solid var(--line); background:var(--control-bg); color:var(--ink); min-width:0; }
  .queue-pinned { padding:8px 10px; border-bottom:1px dashed var(--ask-border); background:var(--ask-bg); }
  .queue-pinned-label { display:flex; align-items:center; justify-content:space-between; gap:6px;
                        font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em;
                        color:var(--warn-ink); margin-bottom:6px; }
  .queue-reset { font-size:10.5px; padding:2px 7px; border-radius:6px; }
  .queue-list { overflow-y:auto; padding:8px; display:flex; flex-direction:column; gap:7px; }
  .qitem { width:100%; text-align:left; border:1px solid var(--line); border-radius:10px;
           padding:9px 11px; background:var(--surface-sub); display:flex; flex-direction:column; gap:4px;
           transition:border-color .14s ease, background-color .14s ease; }
  .qitem:hover:not(.selected):not(:disabled) { border-color:var(--accent); background:var(--surface-hover); }
  .qitem.selected { border-color:var(--accent); background:var(--accent-soft-bg);
                    box-shadow:inset 3px 0 0 var(--accent); }
  .qitem-top { display:flex; align-items:center; justify-content:space-between; gap:6px; font-size:10px; }
  .qitem-kind { font-weight:700; text-transform:uppercase; letter-spacing:.05em; padding:2px 6px;
                border-radius:999px; background:var(--pill-bg); color:var(--dim); }
  .qitem.selected .qitem-kind { background:var(--accent); color:var(--accent-ink); }
  .qitem-kind.kind-pr_review { background:var(--accent-soft-bg); color:var(--accent-soft-ink); }
  .qitem-kind.kind-standup { background:var(--ok-bg); color:var(--ok-ink); }
  .qitem-kind.kind-architecture_doc { background:var(--warn-bg); color:var(--warn-ink); }
  .qitem.selected .qitem-kind.kind-pr_review,
  .qitem.selected .qitem-kind.kind-standup,
  .qitem.selected .qitem-kind.kind-architecture_doc { background:var(--accent); color:var(--accent-ink); }
  .qitem-seq { color:var(--dim); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .qitem-title { font-size:12.5px; font-weight:650; color:var(--ink); line-height:1.3;
                 display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .qitem-meta { font-size:11px; color:var(--dim); display:flex; align-items:center; justify-content:space-between; gap:6px; }
  .queue-empty { padding:18px 12px; text-align:center; font-size:12px; color:var(--dim); }
  .stage-pane { min-width:0; }
  .bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:20px;
         padding:12px 16px; background:var(--surface); border:1px solid var(--line);
         border-radius:12px; }
  button { font:inherit; font-size:14px; padding:8px 15px; border-radius:9px; cursor:pointer;
           border:1px solid var(--line); background:var(--control-bg); color:var(--ink);
           transition:border-color .15s ease, background-color .15s ease; }
  button:hover:not(:disabled) { border-color:var(--accent); background:var(--surface-hover); }
  button.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600; }
  button.primary:hover:not(:disabled) { filter:brightness(1.06); background:var(--accent); }
  button:disabled { opacity:.45; cursor:default; }
  .track { flex:1 1 300px; height:7px; background:var(--track-bg); border-radius:4px; overflow:hidden;
           min-width:180px; cursor:pointer; }
  .track > i { display:block; height:100%; width:100%; background:var(--accent);
               transform-origin:left center; transform:scaleX(0); transition:transform .2s linear; }
  .clock { font-variant-numeric:tabular-nums; font-size:12px; color:var(--dim); min-width:96px; text-align:right; }

  /* Unified A-HUD container: integrated single-row pack tab-header + connected tab-body */
  .hud { background:var(--surface); border:1px solid var(--line); border-radius:14px;
         padding:0; margin-bottom:20px; overflow:hidden; }
  .hud[hidden] { display:none; }
  .hud-tabbar { display:flex; align-items:flex-end; justify-content:space-between; gap:10px;
                background:var(--surface-sub); border-bottom:1px solid var(--line);
                padding:10px 14px 0; }
  .hud-tabstrip { display:flex; align-items:flex-end; gap:6px; flex-wrap:nowrap;
                  overflow-x:auto; scrollbar-width:thin; flex:1 1 auto; min-width:0; }
  .hud-tab { flex:0 0 auto; text-align:left; border:1px solid transparent; border-bottom:1px solid transparent;
             border-radius:10px 10px 0 0; padding:8px 13px 10px; background:transparent;
             color:var(--dim); display:flex; flex-direction:column; gap:3px; max-width:260px;
             transition:background-color .15s ease, color .15s ease, border-color .15s ease; }
  .hud-tab:hover:not(.active):not(:disabled) { background:var(--surface-hover); color:var(--ink);
                                               border-color:var(--line); border-bottom-color:transparent; }
  .hud-tab.active { background:var(--surface); color:var(--ink); border-color:var(--line);
                    border-top:2px solid var(--accent); border-bottom-color:var(--surface);
                    margin-bottom:-1px; }
  .hud-tab-top { display:flex; align-items:center; gap:7px; font-size:10px; }
  .hud-tab-kind { font-weight:700; text-transform:uppercase; letter-spacing:.06em; padding:2px 6px;
                  border-radius:999px; background:var(--pill-bg); color:var(--dim); }
  .hud-tab.active .hud-tab-kind { background:var(--accent); color:var(--accent-ink); }
  .hud-tab-meta { color:var(--dim); white-space:nowrap; }
  .hud-tab-name { font-size:12.5px; font-weight:650; line-height:1.25; white-space:nowrap;
                  overflow:hidden; text-overflow:ellipsis; }
  .hud-tabtools { flex:0 0 auto; display:flex; align-items:center; gap:8px; padding-bottom:9px;
                  white-space:nowrap; }
  .hud-refresh { font-size:11px; padding:4px 10px; border-radius:7px; }
  .hud-body { padding:18px 22px 20px; }
  .hud-top { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
             margin-bottom:10px; }
  .hud-title { font-size:12px; text-transform:uppercase; letter-spacing:.09em; color:var(--dim);
               font-weight:700; }
  .hud-prov { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:11px; color:var(--dim);
              margin:0 0 12px; }
  .prov-chip { padding:2px 8px; border-radius:999px; background:var(--pill-bg); border:1px solid var(--line);
               color:var(--dim); font-weight:600; }
  .prov-chip.live { background:var(--ok-bg); color:var(--ok-ink); border-color:var(--ok-border); }
  .prov-chip.stale { background:var(--warn-bg); color:var(--warn-ink); border-color:var(--warn-border); }
  .hud-summary { font-size:14px; color:var(--ink); margin:0 0 14px; }
  .oversight { display:inline-flex; gap:4px; background:var(--pill-bg); padding:3px; border-radius:9px;
               border:1px solid var(--line); }
  .oversight button { border:none; background:transparent; font-size:12px; padding:5px 10px;
                      border-radius:7px; color:var(--dim); font-weight:600; }
  .oversight button:hover:not(:disabled) { background:var(--surface-hover); color:var(--ink); }
  .oversight button.on { background:var(--surface); color:var(--ink); box-shadow:var(--shadow-sm); }
  .hud-stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px;
               margin-bottom:14px; }
  .stat-card { border:1px solid var(--line); border-radius:10px; padding:10px 12px; background:var(--surface-sub); }
  .stat-label { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); }
  .stat-val { font-size:22px; font-weight:700; margin:2px 0; color:var(--ink); }
  .stat-trend { display:inline-block; font-size:11px; padding:2px 7px; border-radius:999px; font-weight:600;
                background:var(--pill-bg); color:var(--dim); }
  .stat-trend.ok { background:var(--ok-bg); color:var(--ok-ink); }
  .stat-trend.warn { background:var(--warn-bg); color:var(--warn-ink); }
  .hud-nodes { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px;
               margin-top:10px; }
  .node-card { border:1px solid var(--line); border-radius:10px; padding:11px 13px; background:var(--surface-sub);
               display:flex; flex-direction:column; gap:6px; }
  .node-card.lead { border-color:var(--lead-border); background:var(--lead-bg); }
  .node-card.video { border-color:var(--video-border); background:var(--video-bg); }
  .node-card.state-bottleneck { border-color:var(--err-border); }
  .node-card.state-waiting_merge { border-color:var(--warn-border); }
  .node-head { display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .node-name { font-weight:650; font-size:14px; color:var(--ink); }
  .node-role { font-size:11px; padding:2px 7px; border-radius:999px; background:var(--pill-bg); color:var(--dim);
               font-weight:600; }
  .node-state { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:650;
                padding:2px 8px; border-radius:999px; align-self:flex-start;
                background:var(--pill-bg); color:var(--dim); border:1px solid var(--line); }
  .node-state.active, .node-state.ready { background:var(--ok-bg); color:var(--ok-ink); border-color:var(--ok-border); }
  .node-state.waiting_merge, .node-state.idle { background:var(--warn-bg); color:var(--warn-ink); border-color:var(--warn-border); }
  .node-state.bottleneck { background:var(--err-bg); color:var(--err-ink); border-color:var(--err-border); }
  .node-desc { font-size:13px; color:var(--dim); margin:0; }
  .node-actions { display:flex; gap:6px; flex-wrap:wrap; margin-top:auto; padding-top:2px; }

<body>
<header id="sticky-header">
  <h1>__TITLE__</h1>

    <button id="mini-play" class="mini-btn" type="button" aria-label="Play or pause">&#9654; Play</button>

</header>

<main id="app-main">

  <div class="workspace" id="workspace">
    <aside class="queue-pane" id="queue-pane" aria-label="Agent sessions and artifact packs message queue" hidden></aside>
    <div class="stage-pane" id="stage-pane">
      <div class="bar" id="full-bar">
        <button id="play" class="primary" type="button">&#9654; Play</button>
        <button id="pause" type="button">&#10074;&#10074; Pause</button>
        <button id="restart" type="button">&#8634; Restart</button>
        <button id="voicebtn" type="button" title="Speak with the system voice if the audio cannot play">Use system voice</button>
        <div class="track" id="full-track"><i id="fill"></i></div>

<footer>
  <div class="cap"><span id="cap"></span></div>
  <div class="hint" id="footer-hint">Space = play/pause &middot; &#8592;/&#8594; = previous/next scene &middot; briefing audio is pre-generated for exact slide sync; pause or click any agent node anytime for live chat</div>
</footer>

<script>
let DATA = __DATA__;

function detectDarkMode() {
  const htmlMode = document.documentElement.getAttribute('data-color-mode');
  const bodyMode = document.body && document.body.getAttribute('data-color-mode');
  const mode = (bodyMode || htmlMode || '').toLowerCase();
  if (mode === 'dark') return true;
  if (mode === 'light') return false;
  if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) return true;
  const bg = getComputedStyle(document.documentElement).getPropertyValue('--background-color-default').trim();
  const hex = bg.match(/^#([0-9a-f]{6})$/i);
  if (hex) {
    const n = parseInt(hex[1], 16);
    const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    return (0.299 * r + 0.587 * g + 0.114 * b) < 128;
  }
  return false;
}

let darkTheme = false;
let mermaidRenderSeq = 0;
function configureMermaid(dark) {
  mermaid.initialize({
    startOnLoad: false,
    theme: 'base',
    securityLevel: 'loose',
    themeVariables: dark
      ? {
          fontFamily: '-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif',
          fontSize: '15px',
          primaryColor: '#1f2633',
          primaryTextColor: '#e6edf3',
          primaryBorderColor: '#484f58',
          lineColor: '#8b949e',
          textColor: '#e6edf3',
          clusterBkg: '#161b22',
          clusterBorder: '#30363d',
          edgeLabelBackground: '#161b22',
        }
      : {
          fontFamily: '-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif',
          fontSize: '15px',
          primaryColor: '#ffffff',
          primaryTextColor: '#1b1b1f',
          primaryBorderColor: '#c9c9d4',
          lineColor: '#8a8a99',
          textColor: '#1b1b1f',
          clusterBkg: '#f8f9fc',
          clusterBorder: '#d8dbe5',
          edgeLabelBackground: '#ffffff',
        },
  });
}

function syncThemeClass() {
  darkTheme = detectDarkMode();
  document.documentElement.classList.toggle('is-dark', darkTheme);
  if (darkTheme && !document.documentElement.getAttribute('data-color-mode')) {
    document.documentElement.setAttribute('data-color-mode', 'dark');
  }
  configureMermaid(darkTheme);
}
syncThemeClass();

const $ = (id) => document.getElementById(id);
const fmt = (s) => Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0');
const esc = (s) => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const safeUrl = (u) => {
  if (typeof u !== 'string' || !u.trim()) return null;
  try {
    const parsed = new URL(u);
    return ['https:', 'http:', 'file:'].includes(parsed.protocol) ? parsed.href : null;
  } catch { return null; }
};

const player = new Audio();
player.preload = 'auto';
let sceneIdx = -1, idx = -1, raf = 0, playing = false;
let useSystem = false, sysStart = 0, sysOffset = 0, sysScene = -1;
let pending = null;
let wallStart = 0, wallBase = 0;
let hudOversight = (DATA.hud && DATA.hud.oversight_default) || 'lead';
let lastA2uiAction = null;
let liveA2uiOverride = null;
let bridgeAgentStatus = 'standalone';
let bridgeSource = null;
let discoveredHuds = [];
let discoveredPacks = [];
let selectedPackId = null;
let selectedPackDir = null;
let queueFilter = { category: 'all', agent: 'all', sort: 'desc' };
let liveTelemetry = null;
let telemetryLoading = false;
let lastDetResult = null;
let expandedRulesNodeId = null;
let liveChatTarget = null;
let audioCatalog = { available: false, endpoint: null, models: [] };
let regenJobsByDir = new Map();
let voiceFeedback = null; // { kind: 'done'|'err', text: string }
const DEFAULT_FOOTER_HINT = 'Space = play/pause · ←/→ = previous/next scene · briefing audio is pre-generated for exact slide sync; pause or click any agent node anytime for live chat';
const BRIDGE = (typeof window.__WALKTHROUGH_BRIDGE__ === 'object' && window.__WALKTHROUGH_BRIDGE__) ? window.__WALKTHROUGH_BRIDGE__ : null;
let recordedMetaHtml = $('voice-meta').innerHTML;
if (!DATA.tts) {
  const mMatch = recordedMetaHtml.match(/narration:\s*<b>([^<]+)<\/b>/i);
  const vMatch = recordedMetaHtml.match(/voice\s*<b>([^<]+)<\/b>/i);
  DATA.tts = {
    model: mMatch ? mMatch[1].trim() : 'none',
    voice: vMatch ? vMatch[1].trim() : 'none',
  };
}
if (!DATA.master_audio && (!DATA.tts || !DATA.tts.model || DATA.tts.model === 'none')) {
  useSystem = true;
}
if (BRIDGE && typeof history !== 'undefined' && 'scrollRestoration' in history) {
  try { history.scrollRestoration = 'manual'; } catch (e) {}
}

// Deterministic GitHub PR / Issue reference normalizer & linker.
// Mutates standard PR #000 / Issue #000 / owner/repo#000 / bare #000 text into
// "[Repository-Name] / [PR #000 | Issue #000]" hyperlinks opening in _blank.
function getRepoRefContext() {
  let defaultSlug = (liveTelemetry && liveTelemetry.repoSlug) || DATA.repo || null;
  const kindByKey = new Map();
  const slugByShort = new Map();

  const registerSlug = (slug) => {
    if (!slug || !slug.includes('/')) return;
    const parts = slug.split('/');
    slugByShort.set(parts[1].toLowerCase(), slug);
    if (!defaultSlug) defaultSlug = slug;
  };

  const ingestUrl = (url) => {
    if (typeof url !== 'string') return;
    const m = url.match(/https?:\/\/github\.com\/([A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+)(?:\/(pull|issues)\/(\d+))?/i);
    if (!m) return;
    const slug = m[1];
    registerSlug(slug);
    if (m[2] && m[3]) {
      kindByKey.set(slug.toLowerCase() + '#' + m[3], m[2].toLowerCase() === 'pull' ? 'pr' : 'issue');
    }
  };

  if (defaultSlug) registerSlug(defaultSlug);
  ((DATA.hud && DATA.hud.artifacts) || []).forEach((a) => ingestUrl(a && a.url));
  ((liveTelemetry && liveTelemetry.artifacts) || []).forEach((a) => ingestUrl(a && a.url));

  const defaultOwner = defaultSlug ? defaultSlug.split('/')[0] : null;
  const defaultKeyPrefix = defaultSlug ? defaultSlug.toLowerCase() + '#' : null;

  if (defaultKeyPrefix) {
    ((liveTelemetry && liveTelemetry.stats) || []).forEach((st) => {
      const pm = String(st && st.label || '').match(/\bPR\s*#?(\d+)\b/i);
      if (pm) kindByKey.set(defaultKeyPrefix + pm[1], 'pr');
    });
    ((liveTelemetry && liveTelemetry.nodes) || []).forEach((nd) => {
      ((nd && nd.quick_actions) || []).forEach((qa) => {
        const ctx = qa && qa.context;
        if (ctx && ctx.issue) kindByKey.set(defaultKeyPrefix + ctx.issue, 'issue');
        if (ctx && ctx.pr) kindByKey.set(defaultKeyPrefix + ctx.pr, 'pr');
      });
    });
    (DATA.scenes || []).forEach((sc) => {
      if (sc && sc.meta && sc.meta.pr) kindByKey.set(defaultKeyPrefix + sc.meta.pr, 'pr');
      if (sc && sc.meta && sc.meta.issue) kindByKey.set(defaultKeyPrefix + sc.meta.issue, 'issue');
    });
    const titlePr = String(DATA.title || '').match(/\bPR\s*#?(\d+)\b/i);
    if (titlePr) kindByKey.set(defaultKeyPrefix + titlePr[1], 'pr');
  }

  return { defaultSlug, defaultOwner, kindByKey, slugByShort };
}

function buildGhRefHtml({ slug, kind, num }) {
  const repoName = slug.includes('/') ? slug.split('/')[1] : slug;
  const labelKind = kind === 'pr' ? 'PR' : 'Issue';
  const pathSeg = kind === 'pr' ? 'pull' : 'issues';
  const href = 'https://github.com/' + encodeURI(slug) + '/' + pathSeg + '/' + encodeURIComponent(String(num));
  return '<a class="gh-ref gh-ref-' + kind + '" href="' + esc(href) +
    '" target="_blank" rel="noopener noreferrer" title="Open ' + esc(slug + ' ' + labelKind + ' #' + num) +
    ' in browser" data-gh-repo="' + esc(slug) + '" data-gh-kind="' + kind + '" data-gh-num="' + esc(num) + '">' +
    '<span class="gh-ref-repo">' + esc(repoName) + '</span>' +
    '<span class="gh-ref-sep"> / </span>' +
    '<span class="gh-ref-num">' + labelKind + ' #' + esc(num) + '</span>' +
    '<span class="gh-ref-ext" aria-hidden="true"> &#8599;</span></a>';
}

// Combined deterministic pattern (longest/most-qualified branches first; positive non-zero numbers only):
//  1. owner/repo#123
//  2. short-repo-name#123 (no space before #) OR known repo-name + (PR|Issue)? #123
//  3. PR #123 / PR 123 / Pull Request #123 / Issue #123 / Issue 123
//  4. bare #123 (positive non-zero integer, guarded against hex colors like #000/#e8f6ec, HTML entities, URLs)
const GH_REF_RE = /(?<![A-Za-z0-9_/.])([A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+)#([1-9]\d{0,5})\b|(?<![A-Za-z0-9_/.])([A-Za-z0-9]+(?:-[A-Za-z0-9_.-]+)+)(\s+(?:(PR|Pull\s+Request)|(Issue))\s*#?|\s+#|#)([1-9]\d{0,5})\b|\b(?:(PR|Pull\s+[Rr]equest)|(Issue))\s*#?([1-9]\d{0,5})\b|(?<![A-Za-z0-9_&#/.])#([1-9]\d{0,5})\b/gi;

function linkifyGitHubRefs(rawText, ctxOverride) {
  const text = String(rawText ?? '');
  const ctx = ctxOverride || getRepoRefContext();
  if (!ctx.defaultSlug && !/[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+#\d/.test(text)) {
    return esc(text);
  }
  let out = '';
  let last = 0;
  GH_REF_RE.lastIndex = 0;
  let m;
  while ((m = GH_REF_RE.exec(text)) !== null) {
    const matchStr = m[0];
    const start = m.index;
    let slug = null;
    let explicitKind = null;
    let num = null;
    let consumeStart = start;

    if (m[1] && m[2]) {
      // owner/repo#N
      slug = m[1];
      num = m[2];
    } else if (m[3] && m[7]) {
      const shortName = m[3];
      const sep = m[4] || '';
      const knownSlug = ctx.slugByShort.get(shortName.toLowerCase());
      if (knownSlug) {
        slug = knownSlug;
      } else if (sep === '#' && ctx.defaultOwner) {
        // Attached shorthand like corven-agents#57
        slug = ctx.defaultOwner + '/' + shortName;
      } else {
        // Hyphenated English phrase before a normal PR/Issue ref (e.g. "Follow-Up PR #353"):
        // emit shortName verbatim as plain text and linkify only the trailing PR/Issue ref!
        slug = ctx.defaultSlug;
        consumeStart = start + shortName.length + (sep.length - sep.trimStart().length);
      }
      if (m[5]) explicitKind = 'pr';
      else if (m[6]) explicitKind = 'issue';
      num = m[7];
    } else if (m[10]) {
      // PR #N / Pull Request #N / Issue #N
      slug = ctx.defaultSlug;
      explicitKind = m[8] ? 'pr' : 'issue';
      num = m[10];
    } else if (m[11]) {
      // bare #N
      slug = ctx.defaultSlug;
      num = m[11];
    }

    if (!slug || !num) continue;
    const key = slug.toLowerCase() + '#' + num;
    const kind = explicitKind || ctx.kindByKey.get(key) || 'issue';
    out += esc(text.slice(last, consumeStart)) + buildGhRefHtml({ slug, kind, num });
    last = start + matchStr.length;
  }
  out += esc(text.slice(last));
  return out;
}

function extractGitHubRefs(rawText, ctxOverride) {
  const text = String(rawText ?? '');
  const ctx = ctxOverride || getRepoRefContext();
  if (!ctx.defaultSlug && !/[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+#[1-9]/.test(text)) return [];
  const seen = new Set();
  const refs = [];
  GH_REF_RE.lastIndex = 0;
  let m;
  while ((m = GH_REF_RE.exec(text)) !== null) {
    let slug = null;
    let explicitKind = null;
    let num = null;
    if (m[1] && m[2]) {
      slug = m[1];
      num = m[2];
    } else if (m[3] && m[7]) {
      const shortName = m[3];
      const sep = m[4] || '';
      const knownSlug = ctx.slugByShort.get(shortName.toLowerCase());
      if (knownSlug) slug = knownSlug;
      else if (sep === '#' && ctx.defaultOwner) slug = ctx.defaultOwner + '/' + shortName;
      else slug = ctx.defaultSlug;
      if (m[5]) explicitKind = 'pr';
      else if (m[6]) explicitKind = 'issue';
      num = m[7];
    } else if (m[10]) {
      slug = ctx.defaultSlug;
      explicitKind = m[8] ? 'pr' : 'issue';
      num = m[10];
    } else if (m[11]) {
      slug = ctx.defaultSlug;
      num = m[11];
    }
    if (!slug || !num) continue;
    const key = slug.toLowerCase() + '#' + num;
    if (seen.has(key)) continue;
    seen.add(key);
    const kind = explicitKind || ctx.kindByKey.get(key) || 'issue';
    refs.push({ slug, kind, num });
  }
  return refs;
}

const SKIP_REF_TAGS = new Set(['A', 'BUTTON', 'CODE', 'PRE', 'SCRIPT', 'STYLE', 'SVG', 'DEFS', 'TITLE', 'INPUT', 'TEXTAREA', 'SUMMARY']);

function enhanceDomGitHubRefs(rootEl, ctxOverride) {
  if (!rootEl || typeof document.createTreeWalker !== 'function') return;
  const ctx = ctxOverride || getRepoRefContext();
  if (!ctx.defaultSlug && ctx.slugByShort.size === 0) return;

  // 1. Format existing direct GitHub PR/Issue anchor labels (e.g. "PR #351 (MERGED)" -> "venom-dog-sports / PR #351 (MERGED)")
  rootEl.querySelectorAll('a[href*="github.com/"]:not(.gh-ref)').forEach((a) => {
    a.setAttribute('target', '_blank');
    a.setAttribute('rel', 'noopener noreferrer');
    const hm = (a.getAttribute('href') || '').match(/https?:\/\/github\.com\/([A-Za-z0-9_.-]+)\/([A-Za-z0-9_.-]+)\/(pull|issues)\/(\d+)/i);
    if (!hm) return;
    const repo = hm[2];
    const kindLbl = hm[3].toLowerCase() === 'pull' ? 'PR' : 'Issue';
    const num = hm[4];
    const cur = (a.textContent || '').trim();
    if (cur.toLowerCase().includes(repo.toLowerCase() + ' /')) return;
    const statusMatch = cur.match(/\(([^)]+)\)\s*$/);
    const suffix = statusMatch ? ' (' + statusMatch[1] + ')' : '';
    a.textContent = repo + ' / ' + kindLbl + ' #' + num + suffix + ' ↗';
    a.setAttribute('data-gh-repo', hm[1] + '/' + repo);
    a.setAttribute('data-gh-kind', hm[3].toLowerCase() === 'pull' ? 'pr' : 'issue');
    a.setAttribute('data-gh-num', num);
  });

  // 2. Mutate text nodes cleanly across cards, scene headers, captions, and Mermaid SVG foreignObjects
  const walker = document.createTreeWalker(rootEl, NodeFilter.SHOW_TEXT);
  const targets = [];
  let node;
  while ((node = walker.nextNode())) {
    const val = node.nodeValue;
    if (!val || !/(?:#[1-9]|\b(?:PR|Pull\s+[Rr]equest|Issue)\s*#?[1-9])/i.test(val)) continue;
    let p = node.parentElement;
    let skip = false;
    while (p && p !== rootEl.parentElement) {
      const upperTag = (p.tagName || '').toUpperCase();
      if (SKIP_REF_TAGS.has(upperTag) || p.classList.contains('gh-ref') || p.classList.contains('scene-tag') || p.classList.contains('node-rules-box') || p.classList.contains('det-formula')) {
        skip = true;
        break;
      }
      p = p.parentElement;
    }
    if (!skip) targets.push(node);
  }

  for (const textNode of targets) {
    const raw = textNode.nodeValue || '';
    const html = linkifyGitHubRefs(raw, ctx);
    if (!html.includes('class="gh-ref')) continue;
    const frag = document.createRange().createContextualFragment(html);
    if (textNode.parentNode) {
      textNode.parentNode.replaceChild(frag, textNode);
    }
  }
}

function enhanceAllRefs() {
  const ctx = getRepoRefContext();
  if (!ctx.defaultSlug) return;
  enhanceDomGitHubRefs($('hud'), ctx);
  enhanceDomGitHubRefs($('slides'), ctx);
  enhanceDomGitHubRefs($('ask'), ctx);
  enhanceDomGitHubRefs($('cap'), ctx);
  for (const comp of sceneComponents) {
    if (comp && typeof comp.renderDiagramRefs === 'function') comp.renderDiagramRefs(ctx);
  }
}

function formatPackKind(kind) {
  if (kind === 'pr_review') return 'PR Review';
  if (kind === 'standup') return 'Daily Standup';
  if (kind === 'architecture_doc') return 'Doc Discussion';
  return 'Walkthrough';
}

function formatClockTime(iso) {
  if (!iso) return '';
  try {
    return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  } catch { return iso; }
}

function formatShortDate(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso);
    return d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' ' +
           d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  } catch { return ''; }
}

function queueStorageKey() {
  const activeHud = discoveredHuds.find((h) => h.active);
  return 'nw:queue-filter:' + ((activeHud && activeHud.id) || (BRIDGE && BRIDGE.instanceId) || 'default');
}

function restoreQueueFilter() {
  try {
    const raw = sessionStorage.getItem(queueStorageKey());
    if (!raw) return;
    const saved = JSON.parse(raw);
    if (saved && typeof saved === 'object') {
      if (typeof saved.category === 'string') queueFilter.category = saved.category;
      if (typeof saved.agent === 'string') queueFilter.agent = saved.agent;
      if (typeof saved.sort === 'string') queueFilter.sort = saved.sort;
    }
  } catch (e) {}
}

function persistQueueFilter() {
  try {
    sessionStorage.setItem(queueStorageKey(), JSON.stringify(queueFilter));
  } catch (e) {}
}

function getFilteredSortedPacks() {
  const list = discoveredPacks.filter((p) => {
    if (queueFilter.category !== 'all' && p.kind !== queueFilter.category) return false;
    if (queueFilter.agent !== 'all' && (p.agent || p.producer || '') !== queueFilter.agent) return false;
    return true;
  });
  const sorted = [...list];
  if (queueFilter.sort === 'asc') {
    sorted.sort((a, b) => String(a.updatedAt || '').localeCompare(String(b.updatedAt || '')));
  } else if (queueFilter.sort === 'category') {
    sorted.sort((a, b) => String(a.kind || '').localeCompare(String(b.kind || '')) || String(b.updatedAt || '').localeCompare(String(a.updatedAt || '')));
  } else if (queueFilter.sort === 'duration') {
    sorted.sort((a, b) => (Number(b.totalDuration) || 0) - (Number(a.totalDuration) || 0));
  } else {
    // Default: descending sequence (newest first)
    sorted.sort((a, b) => String(b.updatedAt || '').localeCompare(String(a.updatedAt || '')));
  }
  return sorted;
}

function isPackSelected(p) {
  if (!p) return false;
  if (selectedPackDir && p.deckDir === selectedPackDir) return true;
  if (selectedPackId && p.id === selectedPackId) return true;
  return Boolean(p.active);
}

function renderQueueItemHtml(p) {
  const sel = isPackSelected(p);
  const dur = typeof p.totalDuration === 'number' ? fmt(p.totalDuration) : '';
  const when = formatShortDate(p.updatedAt);
  const agentName = p.agent || p.producer || 'Agent';
  return '<button type="button" class="qitem' + (sel ? ' selected' : '') + '" ' +
    'aria-current="' + (sel ? 'true' : 'false') + '" ' +
    'data-pack-dir="' + esc(p.deckDir) + '" data-pack-id="' + esc(p.id) + '" ' +
    'data-pack-kind="' + esc(p.kind) + '" data-pack-agent="' + esc(agentName) + '">' +
      '<div class="qitem-top">' +
        '<span class="qitem-kind kind-' + esc(p.kind) + '">' + esc(formatPackKind(p.kind)) + '</span>' +
        '<span class="qitem-seq">' + esc(when || dur) + '</span>' +
      '</div>' +
      '<div class="qitem-title">' + esc(p.title) + '</div>' +
      '<div class="qitem-meta">' +
        '<span>' + esc(agentName) + '</span>' +
        '<span>' + esc([p.sceneCount ? p.sceneCount + ' scenes' : '', dur].filter(Boolean).join(' · ')) + '</span>' +
      '</div>' +
    '</button>';
}

function renderQueuePane() {
  const pane = $('queue-pane');
  const ws = $('workspace');
  const mainEl = $('app-main');
  if (!pane || !ws) return;
  if (!BRIDGE || !discoveredPacks.length) {
    pane.hidden = true;
    ws.classList.remove('has-queue');
    if (mainEl) mainEl.classList.remove('has-queue');
    return;
  }

  ws.classList.add('has-queue');
  if (mainEl) mainEl.classList.add('has-queue');

  // Compute category counts and unique agent options from full discovered list
  const catCounts = new Map();
  const agentsSet = new Set();
  for (const p of discoveredPacks) {
    catCounts.set(p.kind, (catCounts.get(p.kind) || 0) + 1);
    agentsSet.add(p.agent || p.producer || 'Agent');
  }
  const orderedCats = ['all', 'pr_review', 'standup', 'architecture_doc', 'walkthrough'].filter(
    (c) => c === 'all' || catCounts.has(c)
  );
  const agents = [...agentsSet].sort((a, b) => a.localeCompare(b));
  if (queueFilter.agent !== 'all' && !agents.includes(queueFilter.agent)) {
    queueFilter.agent = 'all';
  }

  const visible = getFilteredSortedPacks();
  const activePack = discoveredPacks.find((p) => isPackSelected(p)) || null;
  const activeVisible = activePack ? visible.some((p) => p.deckDir === activePack.deckDir) : true;

  pane.innerHTML =
    '<div class="queue-head">' +
      '<span class="queue-title">Message Queue</span>' +
      '<span class="queue-count" id="queue-count">' + visible.length + ' of ' + discoveredPacks.length + '</span>' +
    '</div>' +
    '<div class="queue-controls">' +
      '<div class="queue-cats" role="group" aria-label="Filter queue by category">' +
        orderedCats.map((c) => {
          const cnt = c === 'all' ? discoveredPacks.length : (catCounts.get(c) || 0);
          const lbl = c === 'all' ? 'All' : formatPackKind(c);
          return '<button type="button" class="qcat-btn' + (queueFilter.category === c ? ' on' : '') +
            '" data-qcat="' + esc(c) + '">' + esc(lbl) + ' (' + cnt + ')</button>';
        }).join('') +
      '</div>' +
      '<div class="queue-selects">' +
        '<select class="queue-select" id="queue-agent-filter" aria-label="Filter queue by agent">' +
          '<option value="all"' + (queueFilter.agent === 'all' ? ' selected' : '') + '>All agents</option>' +
          agents.map((ag) => '<option value="' + esc(ag) + '"' + (queueFilter.agent === ag ? ' selected' : '') + '>' + esc(ag) + '</option>').join('') +
        '</select>' +
        '<select class="queue-select" id="queue-sort" aria-label="Sort message queue">' +
          '<option value="desc"' + (queueFilter.sort === 'desc' ? ' selected' : '') + '>Newest first &#8595;</option>' +
          '<option value="asc"' + (queueFilter.sort === 'asc' ? ' selected' : '') + '>Oldest first &#8593;</option>' +
          '<option value="category"' + (queueFilter.sort === 'category' ? ' selected' : '') + '>Category A&ndash;Z</option>' +
          '<option value="duration"' + (queueFilter.sort === 'duration' ? ' selected' : '') + '>Duration &#8595;</option>' +
        '</select>' +
      '</div>' +
    '</div>' +
    (!activeVisible && activePack
      ? '<div class="queue-pinned" id="queue-pinned-selection">' +
          '<div class="queue-pinned-label">' +
            '<span>Selected (outside filter)</span>' +
            '<button type="button" class="queue-reset" id="queue-reset-btn">Show all</button>' +
          '</div>' +
          renderQueueItemHtml(activePack) +
        '</div>'
      : '') +
    '<div class="queue-list" id="queue-list" role="listbox" aria-label="Pending agent sessions and packs">' +
      (visible.length
        ? visible.map((p) => renderQueueItemHtml(p)).join('')
        : '<div class="queue-empty">No items match the current category/agent filter. Your active selection above is retained.</div>') +
    '</div>';
  pane.hidden = false;

  pane.querySelectorAll('button[data-qcat]').forEach((b) => {
    b.onclick = () => {
      queueFilter.category = b.dataset.qcat;
      persistQueueFilter();
      renderQueuePane();
    };
  });
  const agSel = $('queue-agent-filter');
  if (agSel) {
    agSel.onchange = () => {
      queueFilter.agent = agSel.value;
      persistQueueFilter();
      renderQueuePane();
    };
  }
  const sortSel = $('queue-sort');
  if (sortSel) {
    sortSel.onchange = () => {
      queueFilter.sort = sortSel.value;
      persistQueueFilter();
      renderQueuePane();
    };
  }
  const resetBtn = $('queue-reset-btn');
  if (resetBtn) {
    resetBtn.onclick = () => {
      queueFilter.category = 'all';
      queueFilter.agent = 'all';
      persistQueueFilter();
      renderQueuePane();
    };
  }
  pane.querySelectorAll('button.qitem[data-pack-dir]').forEach((b) => {
    b.onclick = async () => {
      const targetDir = b.dataset.packDir;
      const targetId = b.dataset.packId;
      if (targetDir === selectedPackDir || !BRIDGE || !BRIDGE.selectPackUrl) return;
      const keepY = window.scrollY;
      selectedPackDir = targetDir;
      selectedPackId = targetId;
      persistQueueFilter();
      discoveredPacks = discoveredPacks.map((p) => ({ ...p, active: p.deckDir === targetDir }));
      renderQueuePane();
      try {
        const resp = await fetch(BRIDGE.selectPackUrl, {
          method: 'POST',
          headers: { 'content-type': 'application/json', 'x-canvas-token': BRIDGE.token },
          body: JSON.stringify({ deckDir: targetDir, id: targetId }),
        });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const body = await resp.json();
        if (body && body.data) {
          await applyPackData(body.data, keepY);
          // Refresh live PR/cadence telemetry in background without shifting scroll
          loadTelemetry(true);
        } else {
          window.location.reload();
        }
      } catch (e) {
        loadPacks();
      }
    };
  });
}

async function applyPackData(nextData, preserveScrollY, opts) {
  if (!nextData || !Array.isArray(nextData.scenes)) return;
  const options = opts || {};
  const targetY = typeof preserveScrollY === 'number' ? preserveScrollY : window.scrollY;
  const prevHudH = $('hud') ? $('hud').getBoundingClientRect().height : 0;
  const prevSceneIdx = idx >= 0 ? idx : 0;

  // 1. Explicitly pause any active playback before swapping audio or timeline
  hardPausePlayback();
  const hasRecorded = Boolean(nextData.master_audio) ||
    Boolean(nextData.tts && nextData.tts.model && nextData.tts.model !== 'none');
  useSystem = !hasRecorded;
  $('voicebtn').textContent = useSystem ? 'Use recorded audio' : 'Use system voice';
  sysScene = -1; sceneIdx = -1; idx = -1; pending = null;
  liveA2uiOverride = null;

  // 2. Swap DATA in place (zero page reload, zero HUD collapse, zero scroll jump)
  DATA = nextData;
  HAS_MASTER_AUDIO = Boolean(DATA.master_audio);
  document.title = DATA.title || 'Narrated Walkthrough';
  const h1 = document.querySelector('#sticky-header h1');
  if (h1) h1.textContent = DATA.title || '';
  const ttsModel = (DATA.tts && DATA.tts.model) || 'none';
  const ttsVoice = (DATA.tts && DATA.tts.voice) || 'none';
  recordedMetaHtml = 'narration: <b>' + esc(ttsModel) + '</b> &middot; voice <b>' + esc(ttsVoice) + '</b>';

  const keepIdx = options.preserveSceneIndex
    ? Math.max(0, Math.min(DATA.scenes.length - 1, prevSceneIdx))
    : 0;
  const nextStart = (DATA.scenes[keepIdx] && typeof DATA.scenes[keepIdx].start === 'number')
    ? DATA.scenes[keepIdx].start
    : 0;
  wallBase = nextStart;
  sysOffset = nextStart;

  if (HAS_MASTER_AUDIO) {
    player.src = DATA.master_audio;
    try { player.load(); } catch (e) {}
    if (nextStart > 0) {
      pending = nextStart;
    }
  } else {
    player.removeAttribute('src');
    try { player.load(); } catch (e) {}
  }

  // 3. Rescue #ask from previous <nw-closing-scene> before replacing #slides
  const askEl = $('ask');
  const stage = $('stage-pane');
  if (askEl && stage && askEl.parentElement !== stage) {
    stage.appendChild(askEl);
  }
  if (askEl) {
    askEl.innerHTML = '';
    askEl.hidden = true;
  }

  // 4. Rebuild only the right stage (#slides + #ask) in place
  const slidesHost = $('slides');
  slidesHost.innerHTML = '';
  await build();
  renderAsk();
  const summaryEl = document.querySelector('#hud .hud-summary');
  if (summaryEl && DATA.hud && DATA.hud.summary) {
    summaryEl.textContent = DATA.hud.summary;
    enhanceDomGitHubRefs(summaryEl);
  }
  updateVoiceMeta();
  updatePlayButtons();
  tick();
  enhanceAllRefs();
  syncStickyMedia();

  // 5. Keep exact visual position steady (compensating any HUD summary line-count delta)
  const deltaHud = ($('hud') ? $('hud').getBoundingClientRect().height : 0) - prevHudH;
  const compensatedY = targetY > 40 ? Math.max(0, targetY + deltaHud) : targetY;
  if (Math.abs(window.scrollY - compensatedY) > 1) {
    window.scrollTo({ top: compensatedY, behavior: 'instant' });
  }
}

async function loadHuds() {
  if (!BRIDGE || !BRIDGE.hudsUrl) return;
  try {
    const resp = await fetch(BRIDGE.hudsUrl, { cache: 'no-store' });
    if (!resp.ok) return;
    const data = await resp.json();
    if (Array.isArray(data.huds)) {
      discoveredHuds = data.huds;
      renderHud();
      syncStickyMedia();
    }
  } catch (e) {}
}

async function loadPacks() {
  if (!BRIDGE || !BRIDGE.packsUrl) return;
  try {
    const resp = await fetch(BRIDGE.packsUrl, { cache: 'no-store' });
    if (!resp.ok) return;
    const data = await resp.json();
    if (Array.isArray(data.packs)) {
      discoveredPacks = data.packs;
      const active = discoveredPacks.find((p) => p.active);
      if (active) {
        selectedPackDir = active.deckDir;
        selectedPackId = active.id;
      }
      restoreQueueFilter();
      renderQueuePane();
      syncStickyMedia();
    }
  } catch (e) {}
}

function syncScenesTelemetry(tel) {
  if (!tel) return;
  for (const comp of sceneComponents) {
    if (comp && typeof comp.syncTelemetry === 'function') {
      comp.syncTelemetry(tel);
    }
  }
}

async function loadTelemetry(force) {
  if (!BRIDGE || !BRIDGE.telemetryUrl) return;
  telemetryLoading = true;
  // Never re-render/collapse #hud while loading — only toggle the refresh button label
  const refBtn = $('hud-refresh-btn');
  if (refBtn) { refBtn.disabled = true; refBtn.textContent = 'Refreshing…'; }
  try {
    const url = BRIDGE.telemetryUrl + (force ? '?force=1' : '');
    const resp = await fetch(url, { cache: 'no-store' });
    if (!resp.ok) return;
    const data = await resp.json();
    if (data && data.ok) {
      const keepY = window.scrollY;
      const hadTelemetry = Boolean(liveTelemetry);
      const prevHudH = $('hud') ? $('hud').getBoundingClientRect().height : 0;
      liveTelemetry = data;
      syncScenesTelemetry(liveTelemetry);
      renderHud();
      enhanceAllRefs();
      // Compensate scrollY if HUD height changed while user is scrolled below HUD
      if (hadTelemetry && keepY > 40 && $('hud')) {
        const deltaH = $('hud').getBoundingClientRect().height - prevHudH;
        if (Math.abs(deltaH) > 1) {
          window.scrollTo({ top: Math.max(0, keepY + deltaH), behavior: 'instant' });
        }
      }
    }
  } catch (e) {} finally {
    telemetryLoading = false;
    const btnAfter = $('hud-refresh-btn');
    if (btnAfter) { btnAfter.disabled = false; btnAfter.textContent = 'Refresh live'; }
    syncStickyMedia();
  }
}

function activeSceneId() {
  return (document.querySelector('.slide.active') || {}).id || (DATA.scenes[0] ? 's-' + DATA.scenes[0].id : '');
}

function renderBridgePill(status) {

  const labelMap = {
    ready: 'Live Copilot Bridge · Ready',

    thinking: 'Live Copilot Bridge · Agent turn active…',
    responded: 'Live Copilot Bridge · Agent replied',
    error: 'Live Copilot Bridge · Error',
  };
  const cls = (status === 'dispatching' || status === 'thinking') ? 'busy' : (status === 'error' ? 'err' : '');
  document.querySelectorAll('[data-bridge-pill]').forEach((el) => {
    el.className = 'bridge-pill ' + cls;
    el.textContent = labelMap[status] || ('Live Copilot Bridge · ' + status);
  });
}

async function sendBridgeCallback(payload) {
  if (!BRIDGE || !BRIDGE.actionUrl || !BRIDGE.token) return { bridged: false };
  const enriched = {
    version: 'v1.0',
    sceneId: activeSceneId(),
    timestampSec: Math.round(now() * 100) / 100,
    oversight: hudOversight,
    ...payload,
  };
  const resp = await fetch(BRIDGE.actionUrl, {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-canvas-token': BRIDGE.token,
    },
    body: JSON.stringify(enriched),
  });
  const body = await resp.json().catch(() => ({ ok: false, error: 'Invalid response' }));
  if (!resp.ok || !body.ok) {
    throw new Error(body.error || ('Bridge HTTP ' + resp.status));
  }
  return { bridged: true, ...body };
}

function connectBridgeEvents() {
  if (!BRIDGE || !BRIDGE.eventsUrl || typeof EventSource !== 'function') return;
  bridgeAgentStatus = 'ready';
  bridgeSource = new EventSource(BRIDGE.eventsUrl);
  bridgeSource.addEventListener('bridge_ready', (ev) => {
    try {
      const msg = JSON.parse(ev.data);
      if (msg.oversight) { hudOversight = msg.oversight; renderHud(); }
      if (msg.liveA2ui && Array.isArray(msg.liveA2ui.messages)) {
        liveA2uiOverride = msg.liveA2ui;
        renderAsk();
      }
      if (msg.lastDeterministicResult) {
        lastDetResult = msg.lastDeterministicResult;
        renderHud();
      }
      renderBridgePill(msg.agentStatus || 'ready');
    } catch (e) {}
  });
  bridgeSource.addEventListener('deterministic_result', (ev) => {
    try {
      const msg = JSON.parse(ev.data);
      if (msg && msg.callbackId) {
        lastDetResult = msg;
        renderHud();
        syncStickyMedia();
      }
    } catch (e) {}
  });
  bridgeSource.addEventListener('callback_ack', (ev) => {
    try {
      const msg = JSON.parse(ev.data);
      if (msg.dispatchedToAgent) renderBridgePill('dispatching');
      const st = $('a2ui-status');
      if (st && msg.displayPrompt) {
        st.classList.remove('err');
        st.textContent = msg.dispatchedToAgent
          ? 'Sent to Copilot agent: ' + msg.displayPrompt
          : 'Handled deterministically: ' + msg.action;
      }
    } catch (e) {}
  });
  bridgeSource.addEventListener('agent_status', (ev) => {
    try {
      const msg = JSON.parse(ev.data);
      renderBridgePill(msg.status || 'ready');
      const st = $('a2ui-status');
      if (st && msg.status === 'error' && msg.error) {
        st.classList.add('err');
        st.textContent = 'Bridge error: ' + msg.error;
      }
    } catch (e) {}
  });
  bridgeSource.addEventListener('a2ui_update', (ev) => {
    try {
      const msg = JSON.parse(ev.data);
      if (Array.isArray(msg.messages) && msg.messages.length) {
        liveA2uiOverride = msg;
        renderAsk();
      }
    } catch (e) {}
  });
  bridgeSource.addEventListener('telemetry_update', (ev) => {
    try {
      const msg = JSON.parse(ev.data);
      if (msg && msg.ok) {
        const keepY = window.scrollY;
        const hadTelemetry = Boolean(liveTelemetry);
        const prevHudH = $('hud') ? $('hud').getBoundingClientRect().height : 0;
        liveTelemetry = msg;
        syncScenesTelemetry(liveTelemetry);
        renderHud();
        enhanceAllRefs();
        if (hadTelemetry && keepY > 40 && $('hud')) {
          const deltaH = $('hud').getBoundingClientRect().height - prevHudH;
          if (Math.abs(deltaH) > 1) {
            window.scrollTo({ top: Math.max(0, keepY + deltaH), behavior: 'instant' });
          }
        }
        syncStickyMedia();
      }
    } catch (e) {}
  });
  bridgeSource.addEventListener('pack_switched', (ev) => {
    try {
      const msg = JSON.parse(ev.data);
      if (!msg || !msg.deckDir || msg.deckDir === selectedPackDir) return;
      selectedPackDir = msg.deckDir;
      selectedPackId = msg.packId || selectedPackId;
      discoveredPacks = discoveredPacks.map((p) => ({ ...p, active: p.deckDir === msg.deckDir }));
      renderQueuePane();
      if (msg.data) applyPackData(msg.data, window.scrollY);
    } catch (e) {}
  });
  bridgeSource.addEventListener('audio_regen_started', (ev) => {
    try {
      const job = JSON.parse(ev.data);
      if (!job || !job.deckDir) return;
      regenJobsByDir.set(job.deckDir, job);
      if (job.deckDir === selectedPackDir) {
        hardPausePlayback();
        voiceFeedback = null;
        updateVoiceMeta();
      }
    } catch (e) {}
  });
  bridgeSource.addEventListener('audio_regen_progress', (ev) => {
    try {
      const job = JSON.parse(ev.data);
      if (!job || !job.deckDir) return;
      regenJobsByDir.set(job.deckDir, job);
      if (job.deckDir === selectedPackDir) updateVoiceMeta();
    } catch (e) {}
  });
  bridgeSource.addEventListener('audio_regen_complete', async (ev) => {
    try {
      const msg = JSON.parse(ev.data);
      if (!msg || !msg.deckDir) return;
      regenJobsByDir.delete(msg.deckDir);
      // Update queue item's displayed total duration in place
      if (typeof msg.totalDuration === 'number') {
        discoveredPacks = discoveredPacks.map((p) =>
          p.deckDir === msg.deckDir ? { ...p, totalDuration: msg.totalDuration } : p
        );
        renderQueuePane();
      }
      if (msg.deckDir === selectedPackDir && msg.data) {
        // Explicit hard pause before applying new voice; user must press Play to resume
        hardPausePlayback();
        voiceFeedback = { kind: 'done', text: 'Ready · press Play' };
        await applyPackData(msg.data, window.scrollY, { preserveSceneIndex: true });
        loadTelemetry(true);
      }
    } catch (e) {}
  });
  bridgeSource.addEventListener('audio_regen_error', (ev) => {
    try {
      const job = JSON.parse(ev.data);
      if (!job || !job.deckDir) return;
      regenJobsByDir.delete(job.deckDir);
      if (job.deckDir === selectedPackDir) {
        voiceFeedback = { kind: 'err', text: 'Error: ' + String(job.error || 'regen failed').slice(0, 64) };
        updateVoiceMeta();
      }
    } catch (e) {}
  });
  bridgeSource.addEventListener('deck_reloaded', () => {
    window.location.reload();
  });
}

const RELOAD_SVG = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.4-3.67"/><path d="M13.5 2.5v2.9h-2.9"/></svg>';

function currentPackRegenJob() {
  if (!selectedPackDir) return null;
  const j = regenJobsByDir.get(selectedPackDir);
  return j && j.status === 'running' ? j : null;
}

async function loadAudioModels() {
  if (!BRIDGE || !BRIDGE.audioModelsUrl) return;
  try {
    const resp = await fetch(BRIDGE.audioModelsUrl, { cache: 'no-store' });
    if (!resp.ok) return;
    const data = await resp.json();
    if (data && data.ok) {
      audioCatalog = {
        available: Boolean(data.available),
        endpoint: data.endpoint || null,
        models: Array.isArray(data.models) ? data.models : [],
      };
      if (data.activeJob && data.activeJob.deckDir && data.activeJob.status === 'running') {
        regenJobsByDir.set(data.activeJob.deckDir, data.activeJob);
      }
      updateVoiceMeta();
    }
  } catch (e) {}
}

function resolveVoicesForModel(modelId) {
  const m = audioCatalog.models.find((x) => x.id === modelId);
  const packVoice = DATA.tts && DATA.tts.voice && DATA.tts.voice !== 'none' ? DATA.tts.voice : '';
  if (m) {
    const list = Array.isArray(m.voices) ? [...m.voices] : [];
    if (m.openVoice && packVoice && !list.includes(packVoice)) {
      list.unshift(packVoice);
    }
    return list.length ? list : ['default'];
  }
  return packVoice ? [packVoice] : ['US_James', 'US_Emily', 'default'];
}

async function triggerAudioRegen(modelId, voiceName) {
  // Always immediately pause any active playback before re-recording
  hardPausePlayback();
  voiceFeedback = null;
  if (!BRIDGE || !BRIDGE.audioRegenerateUrl) return;
  if (!modelId || modelId === '__system__') {
    useSystem = true;
    $('voicebtn').textContent = 'Use recorded audio';
    updateVoiceMeta();
    return;
  }
  const targetDir = selectedPackDir || undefined;
  const optimistic = {
    jobId: 'pending',
    deckDir: selectedPackDir || '__active__',
    model: modelId,
    voice: voiceName,
    status: 'running',
    stage: 'synthesizing',
    completedScenes: 0,
    totalScenes: DATA.scenes.length,
    currentScene: null,
  };
  if (selectedPackDir) regenJobsByDir.set(selectedPackDir, optimistic);
  updateVoiceMeta();
  try {
    const resp = await fetch(BRIDGE.audioRegenerateUrl, {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        'x-canvas-token': BRIDGE.token,
      },
      body: JSON.stringify({
        ...(targetDir ? { deckDir: targetDir } : {}),
        model: modelId,
        voice: voiceName,
        ...(audioCatalog.endpoint ? { endpoint: audioCatalog.endpoint } : {}),
      }),
    });
    const body = await resp.json().catch(() => ({ ok: false, error: 'Invalid response' }));
    if (!resp.ok || !body.ok) {
      if (selectedPackDir) regenJobsByDir.delete(selectedPackDir);
      voiceFeedback = { kind: 'err', text: String(body.error || ('HTTP ' + resp.status)).slice(0, 64) };
      updateVoiceMeta();
      return;
    }
    if (body.job && body.job.deckDir) {
      selectedPackDir = selectedPackDir || body.job.deckDir;
      regenJobsByDir.set(body.job.deckDir, body.job);
      updateVoiceMeta();
    }
  } catch (err) {
    if (selectedPackDir) regenJobsByDir.delete(selectedPackDir);
    voiceFeedback = { kind: 'err', text: String(err.message || err).slice(0, 64) };
    updateVoiceMeta();
  }
}

function updateVoiceMeta() {
  const meta = $('voice-meta');
  if (!meta) return;
  if (!BRIDGE || !BRIDGE.audioModelsUrl) {
    if (useSystem) {
      meta.classList.add('is-fallback');
      meta.innerHTML = 'audio: <b>system voice fallback</b>';
    } else {
      meta.classList.remove('is-fallback');
      meta.innerHTML = recordedMetaHtml;
    }
    return;
  }

  const job = currentPackRegenJob();
  const packModel = (DATA.tts && DATA.tts.model && DATA.tts.model !== 'none') ? DATA.tts.model : '';
  const packVoice = (DATA.tts && DATA.tts.voice && DATA.tts.voice !== 'none') ? DATA.tts.voice : '';
  const activeModel = job ? job.model : (useSystem || !packModel ? '__system__' : packModel);
  const activeVoice = job ? job.voice : packVoice;

  meta.classList.toggle('is-fallback', activeModel === '__system__' && !job);

  const ttsModels = audioCatalog.models.filter((m) => m.kind === 'tts');
  const stsModels = audioCatalog.models.filter((m) => m.kind === 'sts');
  const knownIds = new Set(audioCatalog.models.map((m) => m.id));

  let modelOpts = '';
  if (ttsModels.length) {
    modelOpts += '<optgroup label="oMLX TTS">' + ttsModels.map((m) =>
      '<option value="' + esc(m.id) + '"' + (m.id === activeModel ? ' selected' : '') + '>' +
      esc(m.id) + ' [TTS]</option>'
    ).join('') + '</optgroup>';
  }
  if (stsModels.length) {
    modelOpts += '<optgroup label="oMLX Speech-to-Speech">' + stsModels.map((m) =>
      '<option value="' + esc(m.id) + '"' + (m.id === activeModel ? ' selected' : '') + '>' +
      esc(m.id) + ' [S2S]</option>'
    ).join('') + '</optgroup>';
  }
  if (activeModel && activeModel !== '__system__' && !knownIds.has(activeModel)) {
    modelOpts += '<optgroup label="Recorded Model"><option value="' + esc(activeModel) + '" selected>' +
      esc(activeModel) + '</option></optgroup>';
  }
  modelOpts += '<optgroup label="Device / Fallback"><option value="__system__"' +
    (activeModel === '__system__' ? ' selected' : '') + '>System device voice</option></optgroup>';

  const voices = activeModel !== '__system__' ? resolveVoicesForModel(activeModel) : [];
  const selectedVoice = voices.includes(activeVoice) ? activeVoice : (voices[0] || '');
  const voiceOpts = voices.map((v) =>
    '<option value="' + esc(v) + '"' + (v === selectedVoice ? ' selected' : '') + '>' + esc(v) + '</option>'
  ).join('');

  let statusHtml = '';
  if (job) {
    const prog = job.stage === 'mastering'
      ? 'Mastering…'
      : (job.totalScenes > 0
        ? ('Recording ' + Math.min(job.completedScenes, job.totalScenes) + '/' + job.totalScenes + '…')
        : 'Recording…');
    statusHtml = '<span class="vc-status is-busy" id="vc-status" role="status">' + esc(prog) + '</span>';
  } else if (voiceFeedback) {
    const cls = voiceFeedback.kind === 'err' ? 'is-err' : 'is-done';
    statusHtml = '<span class="vc-status ' + cls + '" id="vc-status" role="status">' + esc(voiceFeedback.text) + '</span>';
  } else {
    statusHtml = '<span class="vc-status" id="vc-status" hidden role="status"></span>';
  }

  const regenTitle = job
    ? 'Regenerating presentation narration…'
    : (activeModel === '__system__'
      ? 'Record presentation narration using oMLX voice model'
      : ('Regenerate presentation narration with ' + activeModel + ' (' + selectedVoice + ')'));

  meta.innerHTML =
    '<span class="vc-label">voice:</span>' +
    '<select id="vc-model" class="vc-select" aria-label="oMLX TTS and speech-to-speech model">' + modelOpts + '</select>' +
    (activeModel !== '__system__'
      ? '<select id="vc-voice" class="vc-select vc-voice" aria-label="Speaker voice">' + voiceOpts + '</select>'
      : '') +
    '<button id="vc-regen" class="vc-regen-btn' + (job ? ' is-spinning' : '') + '" type="button"' +
      ' title="' + esc(regenTitle) + '" aria-label="' + esc(regenTitle) + '"' +
      (job ? ' aria-busy="true"' : '') + '>' + RELOAD_SVG + '</button>' +
    statusHtml;

  const modelSel = $('vc-model');
  const voiceSel = $('vc-voice');
  const regenBtn = $('vc-regen');

  if (modelSel) {
    modelSel.onchange = () => {
      const nextModel = modelSel.value;
      hardPausePlayback();
      if (nextModel === '__system__') {
        useSystem = true;
        voiceFeedback = { kind: 'done', text: 'System voice · press Play' };
        $('voicebtn').textContent = 'Use recorded audio';
        updateVoiceMeta();
        return;
      }
      const nextVoices = resolveVoicesForModel(nextModel);
      const modelMeta = audioCatalog.models.find((m) => m.id === nextModel);
      const nextVoice = (modelMeta && modelMeta.defaultVoice && nextVoices.includes(modelMeta.defaultVoice))
        ? modelMeta.defaultVoice
        : (nextVoices[0] || 'default');
      triggerAudioRegen(nextModel, nextVoice);
    };
  }
  if (voiceSel) {
    voiceSel.onchange = () => {
      const m = modelSel ? modelSel.value : activeModel;
      const v = voiceSel.value;
      if (!m || m === '__system__' || !v) return;
      triggerAudioRegen(m, v);
    };
  }
  if (regenBtn) {
    regenBtn.onclick = () => {
      if (currentPackRegenJob()) return;
      const curM = modelSel ? modelSel.value : activeModel;
      if (curM === '__system__') {
        const preferred = audioCatalog.models[0];
        if (!preferred) {
          hardPausePlayback();
          voiceFeedback = { kind: 'err', text: 'No oMLX voice models found' };
          updateVoiceMeta();
          return;
        }
        triggerAudioRegen(preferred.id, preferred.defaultVoice || preferred.voices[0] || 'default');
        return;
      }
      const curV = voiceSel ? voiceSel.value : (selectedVoice || 'default');
      triggerAudioRegen(curM, curV);
    };
  }
}

function updatePlayButtons() {
  const busy = Boolean(currentPackRegenJob());
  $('play').disabled = playing || busy;
  const mp = $('mini-play');
  if (mp) {
    mp.disabled = busy;
    mp.innerHTML = busy ? '&#8635; Recording…' : (playing ? '&#10074;&#10074; Pause' : '&#9654; Play');
  }
}

function syncStickyMedia() {
  const header = $('sticky-header');
  const fullBar = $('full-bar');
  const mini = $('mini-media');
  if (!header || !fullBar || !mini) return;
  const compact = fullBar.getBoundingClientRect().bottom <= header.getBoundingClientRect().bottom + 4;
  header.classList.toggle('is-compact', compact);
  mini.hidden = !compact;
}

if (typeof IntersectionObserver === 'function') {
  const io = new IntersectionObserver(() => syncStickyMedia(), { threshold: [0, 0.25, 1] });
  io.observe($('full-bar'));
}
window.addEventListener('scroll', syncStickyMedia, { passive: true });
window.addEventListener('resize', syncStickyMedia, { passive: true });

async function renderDiagrams() {
  mermaidRenderSeq += 1;
  const seq = mermaidRenderSeq;
  for (let i = 0; i < DATA.scenes.length; i++) {
    const s = DATA.scenes[i];
    const target = $('d-' + s.id);
    if (!target) continue;
    try {
      const { svg } = await mermaid.render('m-' + seq + '-' + s.id, s.mermaid);
      target.innerHTML = svg;
      // Ensure author-specified pastel fills keep dark legible text even in dark mode
      if (darkTheme) {
        target.querySelectorAll('g.node').forEach((g) => {
          const shape = g.querySelector('rect, polygon, circle, path');
          if (!shape) return;
          const fill = (shape.getAttribute('style') || '') + ' ' + (shape.getAttribute('fill') || '');
          const m = fill.match(/#([0-9a-f]{6})/i);
          if (m) {
            const n = parseInt(m[1], 16);
            const lum = 0.299 * ((n >> 16) & 255) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255);
            if (lum > 165) {
              g.querySelectorAll('.nodeLabel, span, p, text').forEach((el) => {
                el.style.color = '#161922';
                el.style.fill = '#161922';
              });
            }
          }
        });
      }
    } catch (e) {
      target.textContent = 'diagram failed: ' + e.message;
    }
  }
}

// Semantic Light-DOM Web Component hierarchy for walkthrough scenes.
// Every scene inherits base attributes (position, total-scenes, header, start-time,
// duration, active, role-kind) and JS object properties (sceneRef, headerMeta, choices).
// Specialized subclasses (opening, comparison, evidence, narrative, closing) extend
// WalkthroughSceneBase with direct object references to their own specialized contexts.
const sceneComponents = [];

class WalkthroughSceneBase extends HTMLElement {
  static get observedAttributes() {
    return ['scene-id', 'position', 'total-scenes', 'header', 'start-time', 'duration', 'active', 'role-kind'];
  }

  constructor() {
    super();
    this._sceneRef = null;
    this._choices = [];
    this._rendered = false;
  }

  get sceneId() { return this.getAttribute('scene-id') || ''; }
  set sceneId(v) { this.setAttribute('scene-id', String(v ?? '')); }

  get position() { return Number(this.getAttribute('position') || 0); }
  set position(v) { this.setAttribute('position', String(v)); }

  get totalScenes() { return Number(this.getAttribute('total-scenes') || 0); }
  set totalScenes(v) { this.setAttribute('total-scenes', String(v)); }

  get header() { return this.getAttribute('header') || ''; }
  set header(v) { this.setAttribute('header', String(v ?? '')); }

  get startTime() { return Number(this.getAttribute('start-time') || 0); }
  set startTime(v) { this.setAttribute('start-time', String(v)); }

  get duration() { return Number(this.getAttribute('duration') || 0); }
  set duration(v) { this.setAttribute('duration', String(v)); }

  get roleKind() { return this.getAttribute('role-kind') || 'narrative'; }
  set roleKind(v) { this.setAttribute('role-kind', String(v ?? 'narrative')); }

  get active() { return this.hasAttribute('active'); }
  set active(flag) {
    const on = Boolean(flag);
    this.toggleAttribute('active', on);
    this.classList.toggle('active', on);
  }

  get sceneRef() { return this._sceneRef; }
  set sceneRef(obj) {
    this._sceneRef = obj || null;
    if (obj) {
      this.sceneId = obj.id;
      this.header = obj.title;
      this.startTime = obj.start;
      this.duration = obj.duration;
      if (Array.isArray(obj.choices)) this._choices = obj.choices;
    }
  }

  get headerMeta() {
    return {
      sceneId: this.sceneId,
      position: this.position,
      totalScenes: this.totalScenes,
      startTime: this.startTime,
      duration: this.duration,
      roleKind: this.roleKind,
      header: this.header,
      tagName: this.tagName.toLowerCase(),
    };
  }

  get choices() { return this._choices; }
  set choices(list) {
    this._choices = Array.isArray(list) ? list : [];
    if (this._rendered) this.renderInlineChoices();
  }

  connectedCallback() {
    this.classList.add('slide');
    if (this.sceneId && !this.id) this.id = 's-' + this.sceneId;
    if (!this._rendered) this.renderBase();
  }

  attributeChangedCallback(name, oldVal, newVal) {
    if (oldVal === newVal) return;
    if (name === 'active') {
      this.classList.toggle('active', newVal !== null);
    } else if (this._rendered && (name === 'header' || name === 'position' || name === 'total-scenes' || name === 'start-time')) {
      const nEl = this.querySelector(':scope > .slide-head-meta > .n');
      const hEl = this.querySelector(':scope > h2');
      if (nEl) nEl.innerHTML = 'Scene ' + this.position + ' of ' + this.totalScenes + ' &middot; ' + fmt(this.startTime);
      if (hEl) hEl.textContent = this.header;
    }
  }

  renderSpecializedBefore() { return ''; }
  renderSpecializedAfter() { return ''; }
  bindSpecializedEvents() {}
  specializedContextName() { return null; }
  specializedContextRef() { return null; }

  renderInlineChoices() {
    const slot = this.querySelector(':scope > .scene-choices-host');
    if (!slot) return;
    // Closing scene owns its full A2UI surface; non-closing scenes render compact inherited choice chips
    if (this.roleKind === 'closing' || !this._choices.length) {
      slot.innerHTML = '';
      return;
    }
    slot.innerHTML =
      '<div class="scene-choices" role="group" aria-label="Contextual scene choices">' +
        '<span class="scene-choices-label">Scene choices</span>' +
        this._choices.map((ch, idx) =>
          '<button type="button" class="scene-choice-btn' + (ch.variant === 'primary' ? ' primary' : '') +
          '" data-scene-choice="' + idx + '">' + esc(ch.label) + '</button>'
        ).join('') +
      '</div>';
    slot.querySelectorAll('button[data-scene-choice]').forEach((btn) => {
      btn.onclick = async () => {
        const ch = this._choices[Number(btn.dataset.sceneChoice)];
        if (!ch) return;
        const payload = {
          version: 'v1.0',
          label: ch.label,
          sceneId: 's-' + this.sceneId,
          action: {
            name: ch.action || 'select_scene_choice',
            surfaceId: 'scene-' + this.sceneId,
            sourceComponentId: 'choice-' + this.sceneId + '-' + btn.dataset.sceneChoice,
            context: { sceneId: this.sceneId, position: this.position, ...(ch.context || {}) },
          },
        };
        lastA2uiAction = payload;
        window.dispatchEvent(new CustomEvent('a2ui:action', { detail: payload }));
        if (BRIDGE) {
          pauseForLiveChat(ch.label);
          btn.disabled = true;
          try {
            const res = await sendBridgeCallback(payload);
            if (res.result) { lastDetResult = res.result; renderHud(); }
            btn.classList.add('copied');
            btn.textContent = res.dispatchedToAgent ? 'sent to agent' : 'computed';
            setTimeout(() => { btn.classList.remove('copied'); btn.textContent = ch.label; }, 2000);
          } catch (e) {
            btn.textContent = 'failed';
          } finally {
            btn.disabled = false;
          }
        } else {
          try { await navigator.clipboard.writeText(ch.label); } catch (e) {}
          btn.classList.add('copied');
          btn.textContent = 'copied';
          setTimeout(() => { btn.classList.remove('copied'); btn.textContent = ch.label; }, 1600);
        }
      };
    });
  }

  renderDiagramRefs(ctxOverride) {
    const slot = this.querySelector(':scope > .scene-refs-host');
    if (!slot || !this._sceneRef) return;
    // Strip Mermaid style lines so hex colors never enter extraction
    const mermaidClean = String(this._sceneRef.mermaid || '')
      .split(/\r?\n/)
      .filter((line) => !/^\s*style\s+/i.test(line))
      .join('\n');
    const refs = extractGitHubRefs(mermaidClean, ctxOverride);
    if (!refs.length) {
      slot.innerHTML = '';
      return;
    }
    slot.innerHTML =
      '<div class="scene-refs-bar" role="group" aria-label="Referenced pull requests and issues">' +
        '<span class="scene-refs-label">References</span>' +
        refs.map((r) => buildGhRefHtml(r)).join('') +
      '</div>';
  }

  renderBase() {
    this._rendered = true;
    const tag = this.tagName.toLowerCase();
    this.innerHTML =
      '<div class="slide-head-meta">' +
        '<div class="n">Scene ' + this.position + ' of ' + this.totalScenes + ' &middot; ' + fmt(this.startTime) + '</div>' +
        '<span class="scene-tag" title="Semantic Web Component inheriting WalkthroughSceneBase">&lt;' + esc(tag) + '&gt;</span>' +
      '</div>' +
      '<h2>' + esc(this.header) + '</h2>' +
      '<div class="scene-before-host">' + this.renderSpecializedBefore() + '</div>' +
      '<div class="diagram" id="d-' + esc(this.sceneId) + '"></div>' +
      '<div class="scene-refs-host"></div>' +
      '<div class="scene-choices-host"></div>' +
      '<div class="scene-after-host">' + this.renderSpecializedAfter() + '</div>';
    this.renderDiagramRefs();
    this.renderInlineChoices();
    this.bindSpecializedEvents();
    enhanceDomGitHubRefs(this);
  }

  describeComponent() {
    const ctxName = this.specializedContextName();
    return {
      tagName: this.tagName.toLowerCase(),
      inheritsBase: this instanceof WalkthroughSceneBase,
      sceneId: this.sceneId,
      position: this.position,
      totalScenes: this.totalScenes,
      header: this.header,
      roleKind: this.roleKind,
      active: this.active,
      choiceCount: this.choices.length,
      specializedRef: ctxName,
      hasSpecializedObject: Boolean(this.specializedContextRef()),
    };
  }
}
